<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyLoans | Final Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"'] }, colors: { bg: '#020408', surface: '#0B0D12', border: '#1E2129', brand: '#6366F1' } } } }
    </script>
    <style>
        body{background:#020408;color:#E2E8F0}
        .hidden-tab{display:none!important}
        .btn-primary{background:#6366F1;color:white;transition:0.2s}.btn-primary:hover{background:#4F46E5}
        .tab-btn { height: 100%; border-bottom: 2px solid transparent; color: #6B7280; padding: 0 10px; transition: all 0.2s; }
        .tab-active { border-bottom: 2px solid #6366F1; color: white; font-weight: bold; }
        .blink { animation: blinker 1s linear infinite; color: #ef4444; }
        @keyframes blinker { 50% { opacity: 0.5; } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="h-20 border-b border-[#1E2129] flex items-center justify-between px-8 bg-[#020408]/90 backdrop-blur fixed w-full z-50">
        <div class="flex items-center gap-8">
            <span class="font-bold text-lg text-white"><span class="text-brand">▲</span> PolyLoans <span class="text-[10px] text-green-500 bg-green-900/20 px-2 py-1 rounded border border-green-900">LIVE</span></span>
            <div id="navTabs" class="hidden flex gap-6 text-sm font-medium h-20 items-end pb-0">
                <button onclick="switchTab('overview')" id="tab-overview" class="tab-btn tab-active">Overview</button>
                <button onclick="switchTab('borrow')" id="tab-borrow" class="tab-btn">Borrow</button>
                <button onclick="switchTab('lend')" id="tab-lend" class="tab-btn">Lend</button>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div id="userAddr" class="hidden font-mono text-xs text-gray-400 bg-[#0B0D12] border border-[#1E2129] px-3 py-1.5 rounded-full"></div>
            <button id="btnConnect" onclick="connectWallet()" class="btn-primary px-4 py-2 rounded text-sm font-bold shadow-lg">Connect Wallet</button>
        </div>
    </nav>

    <main class="pt-28 p-8 max-w-7xl mx-auto w-full space-y-8">
        <div id="view-overview" class="block space-y-6">
            <h2 class="text-xl font-bold text-white">Dashboard</h2>
            <div class="grid grid-cols-4 gap-6">
                <div class="bg-[#0B0D12] border border-[#1E2129] p-6 rounded-xl"><div class="text-xs text-gray-500 uppercase">My Debt</div><div class="text-2xl font-bold text-red-400" id="statBorrowed">$0.00</div></div>
                <div class="bg-[#0B0D12] border border-[#1E2129] p-6 rounded-xl"><div class="text-xs text-gray-500 uppercase">My Investments</div><div class="text-2xl font-bold text-emerald-400" id="statLent">$0.00</div></div>
            </div>
        </div>

        <div id="view-borrow" class="hidden-tab grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-4 bg-[#0B0D12] border border-[#1E2129] rounded-xl p-6 space-y-5 h-fit">
                <h2 class="font-bold text-white">New Request</h2>
                <div>
                    <div class="flex justify-between mb-1"><label class="text-xs font-bold text-gray-500">Asset</label><label class="text-[10px] text-brand cursor-pointer"><input type="checkbox" onchange="toggleManualInput(this)"> Manual</label></div>
                    <select id="positionSelect" onchange="autoFillForm()" class="w-full bg-[#050608] border border-[#1E2129] rounded px-3 py-2 text-sm text-white outline-none"><option value="">Scanning...</option></select>
                    <input type="text" id="manualTokenId" placeholder="Paste Token ID" class="hidden w-full bg-[#050608] border border-[#1E2129] rounded px-3 py-2 text-sm text-white outline-none" oninput="document.getElementById('b_tokenId').value=this.value">
                    <div id="balanceDisplay" class="text-xs text-brand mt-1 h-4"></div>
                </div>
                <input type="text" id="b_tokenId" class="hidden">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-xs text-gray-500">Shares</label><input type="number" id="b_shares" class="w-full bg-[#050608] border border-[#1E2129] rounded px-3 py-2 text-sm text-white"></div>
                    <div><label class="text-xs text-gray-500">USDC</label><input type="number" id="b_principal" class="w-full bg-[#050608] border border-[#1E2129] rounded px-3 py-2 text-sm text-white"></div>
                </div>
                <div><label class="text-xs text-gray-500 mb-2 block uppercase tracking-wider">Duration (MINUTES ⚠️)</label><input type="number" id="b_duration" class="w-full bg-[#050608] border border-[#1E2129] rounded px-3 py-2 text-sm text-white" placeholder="60"></div>
                <button onclick="handleCreateRequest()" id="btnCreate" class="w-full btn-primary py-3 rounded font-bold text-sm">Sign & Post</button>
            </div>
            <div class="lg:col-span-8 space-y-6">
                <div class="bg-[#0B0D12] border border-[#1E2129] rounded-xl p-6"><h3 class="font-bold text-white mb-4">My Requests</h3><div id="borrowerLoans" class="space-y-4 text-sm text-gray-500">No active debts.</div></div>
                <div class="bg-[#0B0D12] border border-[#1E2129] rounded-xl p-6"><h3 class="font-bold text-white mb-4">Incoming Offers</h3><div id="borrowerOffers" class="grid gap-4 text-sm text-gray-500">No offers.</div></div>
            </div>
        </div>

        <div id="view-lend" class="hidden-tab space-y-6">
            <div class="bg-[#0B0D12] border border-[#1E2129] rounded-xl p-6">
                <div class="flex justify-between items-center mb-4"><h2 class="font-bold text-white">Market Feed</h2><button onclick="loadData()" class="text-xs text-brand">Refresh</button></div>
                <div id="marketFeed" class="space-y-4 text-gray-500 text-sm">Loading...</div>
            </div>
            <div class="bg-[#0B0D12] border border-[#1E2129] rounded-xl p-6"><h3 class="font-bold text-white mb-4">My Investments</h3><div id="lenderLoans" class="space-y-3 text-sm text-gray-500">No investments.</div></div>
        </div>
    </main>

    <script>
    const MARKET_ADDR = "0xe5D387e0135dab4D722838DA348e6f51E9C871Af"; 
    const USDC_ADDR = "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359"; 
    const RENDER_API_URL = "https://polyloans-api.onrender.com"; 

    let signer, userAddress, marketContract, myProxy, ethProvider;
    const INFO_CACHE = {}; 
    const MARKET_ABI = [
        "function createRequest(uint256,uint256,uint256,uint256) external returns (uint256)",
        "function makeOffer(uint256,uint256) external returns (uint256)", // FIXED ABI
        "function acceptOffer(uint256) external",
        "function repayLoan(uint256) external",
        "function liquidateByTime(uint256) external", 
        "function cancelRequest(uint256) external",
        "function requests(uint256) view returns (address, uint256, uint256, uint256, uint256, bool, bool)",
        "function loans(uint256) view returns (address, uint256, uint256, uint256)",
        "function offers(uint256) view returns (uint256, address, uint256, bool)",
        "function nextRequestId() view returns (uint256)",
        "function nextOfferId() view returns (uint256)"
    ];
    const USDC_ABI = ["function approve(address, uint256) external", "function allowance(address, address) view returns (uint256)"];

    async function connectWallet() {
        if(!window.ethereum) return alert("Install Wallet");
        ethProvider = window.ethereum;
        try {
            await ethProvider.request({ method: 'eth_requestAccounts' });
            const provider = new ethers.BrowserProvider(ethProvider);
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();
            marketContract = new ethers.Contract(MARKET_ADDR, MARKET_ABI, signer);
            
            document.getElementById("btnConnect").innerText = userAddress.slice(0,6)+"...";
            document.getElementById("userAddr").innerText = userAddress;
            document.getElementById("userAddr").classList.remove("hidden");
            document.getElementById("btnConnect").style.display = "none";
            document.getElementById("navTabs").classList.remove("hidden");
            
            switchTab('borrow'); 
            await initProxy();
            scanPortfolio(); 
            loadData(); 
            setInterval(loadData, 4000); 
        } catch(e) { console.error(e); }
    }

    function switchTab(t) { 
        ['overview','borrow','lend'].forEach(v => { 
            document.getElementById(`view-${v}`).classList.add('hidden-tab'); 
            document.getElementById(`tab-${v}`).classList.remove('tab-active'); 
        }); 
        document.getElementById(`view-${t}`).classList.remove('hidden-tab'); 
        document.getElementById(`tab-${t}`).classList.add('tab-active'); 
    }

    // --- REPAY WITH APPROVAL CHECK ---
    async function handleRepay(id) {
        if(!confirm("Repay Loan?")) return;
        const usdc = new ethers.Contract(USDC_ADDR, USDC_ABI, signer);
        const allowance = await usdc.allowance(userAddress, MARKET_ADDR);
        if (allowance < ethers.MaxUint256 / 2n) {
            alert("Step 1: Approve USDC Access");
            const txApp = await usdc.approve(MARKET_ADDR, ethers.MaxUint256);
            await txApp.wait();
        }
        alert("Step 2: Sending Repayment...");
        await signAndRelay("repayLoan", [id]);
        alert("✅ Repaid!");
        loadData();
    }

    async function loadData() {
        if(!marketContract) return;
        const nextId = await marketContract.nextRequestId();
        const nextOff = await marketContract.nextOfferId();
        let feed="", bOffers="", bLoans="", lLoans="";
        let requestOffersMap = {}; 

        for(let i=1; i<Number(nextOff); i++) {
            try {
                const off = await marketContract.offers(i); 
                if(off[3]) {
                    const reqKey = off[0].toString();
                    if(!requestOffersMap[reqKey]) requestOffersMap[reqKey] = [];
                    requestOffersMap[reqKey].push({id: i, lender: off[1], rate: Number(off[2])});
                }
            } catch(e){}
        }

        for(let i=1; i<Number(nextId); i++) {
            try {
                const req = await marketContract.requests(i); 
                if (req[1].toString() === "0") continue;
                const info = await getInfo(req[1]);
                const link = `https://polymarket.com/event/${info.slug || 'unknown'}?tid=${req[1]}`;
                const reqKey = i.toString();
                const IAmBorrower = isMe(req[0]);

                if (IAmBorrower) { 
                    if (req[5] && !req[6]) { // PENDING
                        bLoans += `<div class="p-4 border border-gray-700 rounded bg-[#050608] mb-2"><div class="flex justify-between items-start mb-2"><div><div class="font-bold text-white text-sm"><a href="${link}" target="_blank" class="hover:text-brand hover:underline">${info.title}</a></div><div class="text-xs text-orange-400">Waiting for Lender...</div></div><button onclick="handleCancelRequest(${i})" class="text-red-400 text-xs border border-red-900 px-3 py-1 rounded">Cancel</button></div></div>`;
                        const myOffers = requestOffersMap[reqKey] || [];
                        myOffers.forEach(o => { bOffers += `<div class="p-3 border border-green-900 rounded bg-[#051005] flex justify-between items-center mb-1"><div><div class="text-xs text-gray-400">Lender: ${o.lender.slice(0,6)}...</div><div class="text-sm font-bold text-green-400">${o.rate}% APR</div></div><button onclick="handleAcceptOffer(${o.id})" class="bg-green-600 px-3 py-1 rounded text-xs text-white">Accept</button></div>`; });
                    } else if (req[6]) { // ACTIVE
                        const loan = await marketContract.loans(i);
                        const due = Number(loan[2]);
                        const now = Math.floor(Date.now()/1000);
                        const left = due - now;
                        const timer = left > 0 ? `${Math.floor(left/60)}m ${left%60}s` : "EXPIRED";
                        const timerClass = left < 60 ? "blink" : "text-green-400";
                        bLoans += `<div class="p-4 border border-green-900/50 rounded bg-[#050608] mb-2"><div class="flex justify-between items-center"><div><div class="font-bold text-white text-sm">${info.title}</div><div class="text-xs font-mono mt-1">Due: <span class="${timerClass}">${timer}</span></div></div><button onclick="handleRepay(${i})" class="bg-brand text-white text-xs px-3 py-1 rounded">Repay</button></div></div>`;
                    }
                }

                if (!IAmBorrower && req[5] && !req[6]) {
                    const competitors = requestOffersMap[reqKey] || [];
                    const bestRate = competitors.length > 0 ? Math.min(...competitors.map(c=>c.rate)) + "%" : "None";
                    feed += `<div class="p-4 border border-[#1E2129] rounded bg-[#050608] mb-2"><div class="mb-2"><div class="font-bold text-white text-sm"><a href="${link}" target="_blank" class="hover:text-brand hover:underline">${info.title}</a></div><div class="flex gap-4 text-xs text-gray-500 mt-1"><span>Borrower: ${req[0].slice(0,6)}...</span><span>Best Offer: <span class="text-white">${bestRate}</span></span></div></div><div class="flex gap-2"><input id="r_${i}" placeholder="%" class="w-16 bg-black text-white text-center text-xs rounded border border-gray-700"><button onclick="makeOffer(${i})" class="bg-brand px-4 py-1 rounded text-xs text-white font-bold">Offer Loan</button></div></div>`;
                }

                if (!IAmBorrower && req[6]) {
                    const loan = await marketContract.loans(i);
                    if (isMe(loan[0])) { 
                        const due = Number(loan[2]);
                        const now = Math.floor(Date.now()/1000);
                        const canSeize = now > due;
                        lLoans += `<div class="p-4 border border-emerald-900/30 rounded bg-[#050608] mb-2"><div class="font-bold text-white text-sm mb-1">${info.title}</div><div class="flex justify-between items-center"><div class="text-xs font-mono ${canSeize ? 'text-red-500 font-bold' : 'text-emerald-400'}">${canSeize ? "⚠️ EXPIRED" : `Due: ${Math.floor((due-now)/60)}m left`}</div>${canSeize ? `<button onclick="handleSeize(${i})" class="bg-red-600 hover:bg-red-500 text-white text-xs px-3 py-1 rounded font-bold animate-pulse">SEIZE</button>` : `<span class="text-xs text-gray-600">Active</span>`}</div></div>`;
                    }
                }
            } catch(e){ console.error(e) }
        }

        document.getElementById("marketFeed").innerHTML = feed || '<div class="text-center text-xs text-gray-500">No requests.</div>';
        document.getElementById("borrowerLoans").innerHTML = bLoans || '<div class="text-center text-xs text-gray-500">No active debts.</div>';
        document.getElementById("borrowerOffers").innerHTML = bOffers || '<div class="text-center text-xs text-gray-500">No offers.</div>';
        document.getElementById("lenderLoans").innerHTML = lLoans || '<div class="text-center text-xs text-gray-500">No investments.</div>';
    }

    async function handleSeize(id) { if(!confirm("Seize Shares?")) return; await signAndRelay("liquidateByTime", [id]); alert("Seized!"); loadData(); }
    async function handleAcceptOffer(id) { if(!confirm("Accept Offer?")) return; await signAndRelay("acceptOffer", [id]); loadData(); }
    async function handleCancelRequest(id) { if(!confirm("Cancel?")) return; await signAndRelay("cancelRequest", [id]); loadData(); }
    async function makeOffer(id) { const r = document.getElementById("r_"+id).value; if(!r) return alert("Enter Rate"); const u = new ethers.Contract(USDC_ADDR, USDC_ABI, signer); await(await u.approve(MARKET_ADDR,ethers.MaxUint256)).wait(); await(await marketContract.makeOffer(id, Number(r))).wait(); alert("Offer Sent!"); loadData(); }

    async function handleCreateRequest() {
        let id = document.getElementById("manualTokenId").value || document.getElementById("positionSelect").value;
        const s = document.getElementById("b_shares").value;
        const p = document.getElementById("b_principal").value;
        const d = document.getElementById("b_duration").value; 
        if(!id || !s || !p || !d) return alert("Fill all fields");
        const durationSeconds = BigInt(d) * 60n; 
        await signAndRelay('createRequest', [id, BigInt(Math.floor(s*1e6)), BigInt(Math.floor(p*1e6)), durationSeconds]);
        setTimeout(loadData, 2000);
    }

    async function initProxy() { try { const r = await fetch(`${RENDER_API_URL}/get-nonce?user=${userAddress}`); const d = await r.json(); window.myProxy = d.proxy ? d.proxy.toLowerCase() : null; } catch(e) { setTimeout(initProxy, 2000); } }
    async function getInfo(id) { if(INFO_CACHE[id]) return INFO_CACHE[id]; try { const res = await fetch(`${RENDER_API_URL}/market-info?tokenId=${id}`); const d = await res.json(); INFO_CACHE[id]=d; return d; } catch{ return {title:"Unknown", slug:""}; } }
    async function scanPortfolio() {
        const select = document.getElementById("positionSelect");
        try {
            const res = await fetch(`${RENDER_API_URL}/portfolio?user=${userAddress}`);
            const data = await res.json();
            if (!data || data.length === 0) { select.innerHTML = '<option value="">No assets found</option>'; return; }
            select.innerHTML = '<option value="">-- Select Asset --</option>';
            data.forEach(p => { const opt = document.createElement("option"); opt.value = p.asset; opt.setAttribute("data-bal", p.size); opt.setAttribute("data-price", p.livePrice); opt.text = `${p.title} (${Number(p.size).toFixed(2)})`; select.appendChild(opt); });
        } catch(e) { select.innerHTML = '<option value="">Scan Failed</option>'; }
    }
    function toggleManualInput(cb) { document.getElementById("positionSelect").style.display = cb.checked ? "none" : "block"; document.getElementById("manualTokenId").style.display = cb.checked ? "block" : "none"; document.getElementById("b_tokenId").value = ""; }
    function autoFillForm() { const sel = document.getElementById("positionSelect"); if(sel.value) { const opt = sel.selectedOptions[0]; document.getElementById("b_tokenId").value = opt.value; document.getElementById("balanceDisplay").innerText = `Bal: ${opt.getAttribute("data-bal")} | Price: $${Number(opt.getAttribute("data-price")).toFixed(2)}`; } }
    
    async function signAndRelay(func, args) {
        try {
            const nonceRes = await fetch(`${RENDER_API_URL}/get-nonce?user=${userAddress}`);
            const meta = await nonceRes.json();
            const iface = new ethers.Interface(MARKET_ABI);
            const data = iface.encodeFunctionData(func, args);
            const types = { SafeTx: [{type:"address",name:"to"},{type:"uint256",name:"value"},{type:"bytes",name:"data"},{type:"uint8",name:"operation"},{type:"uint256",name:"safeTxGas"},{type:"uint256",name:"baseGas"},{type:"uint256",name:"gasPrice"},{type:"address",name:"gasToken"},{type:"address",name:"refundReceiver"},{type:"uint256",name:"nonce"}] };
            const message = { to: MARKET_ADDR, value: 0, data, operation: 0, safeTxGas: 0, baseGas: 0, gasPrice: 0, gasToken: "0x0000000000000000000000000000000000000000", refundReceiver: "0x0000000000000000000000000000000000000000", nonce: meta.nonce };
            const payload = JSON.stringify({ types: { EIP712Domain: [{name:"chainId",type:"uint256"}, {name:"verifyingContract",type:"address"}], SafeTx: types.SafeTx }, primaryType: "SafeTx", domain: { verifyingContract: meta.proxy, chainId: 137 }, message });
            const sig = await ethProvider.request({ method: "eth_signTypedData_v4", params: [userAddress, payload] });
            const res = await fetch(`${RENDER_API_URL}/relay-tx`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ proxy: meta.proxy, to: MARKET_ADDR, data, signature: sig }) });
            const json = await res.json();
            if(!json.success) throw new Error(json.error);
            return json.txHash;
        } catch(e) { alert("Error: " + e.message); return null; }
    }
    
    function isMe(addr) { if (!addr) return false; const target = addr.toLowerCase(); return (target === userAddress.toLowerCase()) || (window.myProxy && target === window.myProxy); }
    </script>
</body>
</html>
