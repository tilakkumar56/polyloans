<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>PolyLoans</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"']},colors:{bg:'#020408',surface:'#0B0D12',border:'#1E2129',brand:'#6366F1'}}}}; </script>
    <style>body{background:#020408;color:#E2E8F0}.panel{background:#0B0D12;border:1px solid #1E2129}.input-prem{background:#050608;border:1px solid #1E2129;color:#FFF}.hidden-tab{display:none !important}</style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="h-16 border-b border-[#1E2129] flex items-center justify-between px-6 bg-[#020408]">
        <div class="flex items-center gap-8"><span class="font-bold text-lg text-white">PolyLoans</span><div id="navTabs" class="hidden flex gap-4 text-sm font-medium"><button onclick="switchTab('overview')">Overview</button><button onclick="switchTab('borrow')">Borrow</button><button onclick="switchTab('lend')">Lend</button></div></div>
        <button id="btnConnect" onclick="connectWallet()" class="bg-brand px-4 py-2 rounded text-sm font-bold text-white">Connect Wallet</button>
        <div id="userAddr" class="hidden font-mono text-xs text-gray-400"></div>
    </nav>
    
    <main class="p-6 max-w-7xl mx-auto w-full">
        <div id="view-overview" class="space-y-6"><h2 class="text-xl font-bold">Dashboard</h2><div class="grid grid-cols-3 gap-6"><div class="panel p-6 rounded-xl"><div>Borrowed</div><div class="text-2xl font-bold text-red-400" id="statBorrowed">$0.00</div></div><div class="panel p-6 rounded-xl"><div>Lent</div><div class="text-2xl font-bold text-emerald-400" id="statLent">$0.00</div></div><div class="panel p-6 rounded-xl"><div>Shares</div><div class="text-2xl font-bold text-brand" id="statShares">0</div></div></div></div>

        <div id="view-borrow" class="hidden-tab grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-4 panel rounded-xl p-6 space-y-4">
                <h2 class="font-bold">New Request</h2>
                <select id="positionSelect" onchange="autoFillForm()" class="input-prem w-full rounded p-2 text-sm"></select>
                <div id="priceDisplay" class="text-xs h-4"></div>
                <input type="text" id="b_tokenId" class="hidden">
                <div class="grid grid-cols-2 gap-4"><input type="number" id="b_shares" placeholder="Shares" class="input-prem w-full rounded p-2 text-sm" oninput="checkLTV()"><input type="number" id="b_principal" placeholder="USDC" class="input-prem w-full rounded p-2 text-sm" oninput="checkLTV()"></div>
                <div id="ltvWarning" class="text-xs text-right h-4"></div>
                <input type="number" id="b_duration" class="input-prem w-full rounded p-2 text-sm" placeholder="Mins">
                <button onclick="handleCreateRequest()" class="w-full bg-brand py-3 rounded font-bold text-sm">Sign & Post</button>
            </div>
            <div class="lg:col-span-8 space-y-6">
                <div class="panel rounded-xl p-6"><h2 class="font-bold mb-4">Incoming Offers</h2><div id="borrowerOffers"></div></div>
                <div class="panel rounded-xl p-6"><h2 class="font-bold mb-4">Active Debts</h2><div id="borrowerLoans"></div></div>
            </div>
        </div>

        <div id="view-lend" class="hidden-tab space-y-6">
            <div class="panel rounded-xl p-4"><h2 class="font-bold mb-4">Market Feed</h2><div id="marketFeed"></div></div>
            <div class="panel rounded-xl p-6"><h2 class="font-bold mb-4">Investments</h2><div id="lenderLoans"></div></div>
        </div>
    </main>

    <script>
    const MARKET_ADDR = "0x30672b8B427BD7277c8467221441e2D3Dbf833E4"; 
    const USDC_ADDR = "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359"; 
    const RENDER_API_URL = "https://polyloans-api.onrender.com"; 

    let signer, userAddress, marketContract, myProxy;
    const MARKET_ABI = ["function createRequest(uint256,uint256,uint256,uint256) external returns (uint256)","function makeOffer(uint256,uint256,uint256) external returns (uint256)","function acceptOffer(uint256) external","function repayLoan(uint256) external","function cancelRequest(uint256) external","function requests(uint256) view returns (address, uint256, uint256, uint256, uint256, bool, bool)","function loans(uint256) view returns (address, uint256, uint256, uint256)","function offers(uint256) view returns (uint256, address, uint256, bool)","function nextRequestId() view returns (uint256)","function nextOfferId() view returns (uint256)"];
    const USDC_ABI = ["function approve(address, uint256) external"];

    async function connectWallet() {
        if(!window.ethereum) return alert("Install Wallet");
        const provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = await provider.getSigner();
        userAddress = await signer.getAddress();
        marketContract = new ethers.Contract(MARKET_ADDR, MARKET_ABI, signer);
        
        document.getElementById("userAddr").innerText = userAddress;
        document.getElementById("btnConnect").style.display = "none";
        document.getElementById("navTabs").classList.remove("hidden");
        switchTab('overview');

        // Proxy Init
        try { const r = await fetch(`${RENDER_API_URL}/get-nonce?user=${userAddress}`); const d = await r.json(); window.myProxy = d.proxy.toLowerCase(); } catch(e){}

        scanPortfolio(); loadData(); setInterval(loadData, 3000);
    }

    function isMe(addr) { return addr && (addr.toLowerCase() === userAddress.toLowerCase() || addr.toLowerCase() === window.myProxy); }
    function switchTab(t) { ['overview','borrow','lend'].forEach(v => document.getElementById(`view-${v}`).classList.add('hidden-tab')); document.getElementById(`view-${t}`).classList.remove('hidden-tab'); }

    async function loadData() {
        const nextId = await marketContract.nextRequestId();
        const nextOff = await marketContract.nextOfferId();
        let feed="", bOffers="", bLoans="", lLoans="", borrowed=0, lent=0;

        for(let i=1; i<Number(nextId); i++) {
            try {
                const req = await marketContract.requests(i);
                
                // 🔥 ANTI-BIDEN FILTER: BLOCK ID 0
                if (req[1].toString() === "0") continue;

                if (req[5] && !req[6]) { // Active Request
                    const info = await getInfo(req[1]);
                    if (isMe(req[0])) {
                        bLoans += `<div class="p-3 bg-[#0B0D12] rounded border border-gray-800 opacity-70 mb-2"><div class="font-bold text-sm">${info.title}</div><div class="text-xs text-orange-400">Pending</div><button onclick="cancel(${i})" class="text-red-400 text-xs underline">Cancel</button></div>`;
                    } else {
                        feed += `<div class="p-3 border border-gray-800 rounded bg-[#0B0D12] flex justify-between items-center mb-2"><div><div class="font-bold text-sm">${info.title}</div><div class="text-xs text-gray-500">Ask: $${ethers.formatUnits(req[3],6)}</div></div><div class="flex gap-2"><input id="r_${i}" class="w-8 bg-black text-xs text-center" placeholder="%"><button onclick="offer(${i})" class="bg-blue-600 px-2 py-1 text-xs rounded text-white">Offer</button></div></div>`;
                    }
                } else if (req[6]) { // Active Loan
                    const info = await getInfo(req[1]);
                    const princ = Number(ethers.formatUnits(req[3],6));
                    if(isMe(req[0])) { borrowed += princ; bLoans += `<div class="p-3 bg-[#0B0D12] rounded border border-gray-800 mb-2"><div class="font-bold text-sm">${info.title}</div><button onclick="repay(${i})" class="bg-blue-600 w-full text-xs py-1 rounded mt-2">Repay</button></div>`; }
                    if(req[0].toLowerCase() === userAddress.toLowerCase()) { lent += princ; lLoans += `<div class="p-3 bg-[#0B0D12] rounded border border-gray-800 mb-2"><div class="font-bold text-sm">${info.title}</div><div class="text-xs text-green-400">Active Investment</div></div>`; }
                }
            } catch(e){}
        }

        // OFFERS
        for(let i=1; i<Number(nextOff); i++) {
            try {
                const off = await marketContract.offers(i);
                if(off[3]) {
                    const req = await marketContract.requests(off[0]);
                    if(isMe(req[0]) && req[5]) {
                        const info = await getInfo(req[1]);
                        bOffers += `<div class="p-3 bg-[#0B0D12] rounded border border-green-900/50 mb-2 flex justify-between"><div><div class="font-bold text-sm">${info.title}</div><div class="text-xs text-green-400">Rate: ${Number(off[2])}%</div></div><button onclick="accept(${i})" class="bg-green-600 px-3 py-1 rounded text-xs">Accept</button></div>`;
                    }
                }
            } catch(e){}
        }

        document.getElementById("marketFeed").innerHTML = feed || "No requests";
        document.getElementById("borrowerOffers").innerHTML = bOffers || "No offers";
        document.getElementById("borrowerLoans").innerHTML = bLoans || "No debts";
        document.getElementById("lenderLoans").innerHTML = lLoans || "No investments";
    }

    async function getInfo(id) { try { const r = await fetch(`${RENDER_API_URL}/market-info?tokenId=${id}`); return await r.json(); } catch { return {title:"Unknown"}; } }
    async function scanPortfolio() { const res = await fetch(`${RENDER_API_URL}/portfolio?user=${userAddress}`); const data = await res.json(); const sel = document.getElementById("positionSelect"); sel.innerHTML='<option>Select</option>'; data.forEach(p=>{ const o=document.createElement("option"); o.value=p.asset; o.text=`${p.title} (${p.size})`; o.setAttribute("data-bal",p.size); o.setAttribute("data-price",p.livePrice); sel.appendChild(o); }); }
    function autoFillForm() { const o=document.getElementById("positionSelect").selectedOptions[0]; if(o.value) document.getElementById("b_tokenId").value=o.value; }
    function checkLTV() { const s=document.getElementById("b_shares").value; const p=document.getElementById("b_principal").value; const o=document.getElementById("positionSelect").selectedOptions[0]; if(o && p > s*(o.getAttribute("data-price")||0.5)*0.5) document.getElementById("btnCreate").disabled=true; else document.getElementById("btnCreate").disabled=false; }
    
    async function signAndRelay(func, args) {
        const nonceRes = await fetch(`${RENDER_API_URL}/get-nonce?user=${userAddress}`);
        const meta = await nonceRes.json();
        const iface = new ethers.Interface(MARKET_ABI);
        const data = iface.encodeFunctionData(func, args);
        const domain = { verifyingContract: meta.proxy, chainId: 137 };
        const types = { SafeTx: [{type:"address",name:"to"},{type:"uint256",name:"value"},{type:"bytes",name:"data"},{type:"uint8",name:"operation"},{type:"uint256",name:"safeTxGas"},{type:"uint256",name:"baseGas"},{type:"uint256",name:"gasPrice"},{type:"address",name:"gasToken"},{type:"address",name:"refundReceiver"},{type:"uint256",name:"nonce"}] };
        const message = { to: MARKET_ADDR, value: 0, data, operation: 0, safeTxGas: 0, baseGas: 0, gasPrice: 0, gasToken: "0x0000000000000000000000000000000000000000", refundReceiver: "0x0000000000000000000000000000000000000000", nonce: meta.nonce };
        const sig = await signer.signTypedData(domain, types, message);
        await fetch(`${RENDER_API_URL}/relay-tx`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ proxy: meta.proxy, to: MARKET_ADDR, data, signature: sig }) });
        alert("Success!"); location.reload();
    }

    async function handleCreateRequest() {
        const id=document.getElementById("b_tokenId").value; const s=document.getElementById("b_shares").value; const p=document.getElementById("b_principal").value; const d=document.getElementById("b_duration").value;
        await signAndRelay('createRequest', [id, BigInt(Math.floor(s*1e6)), BigInt(Math.floor(p*1e6)), BigInt(d*60)]);
    }

    async function offer(id) { const r=document.getElementById("r_"+id).value; const u=new ethers.Contract(USDC_ADDR,USDC_ABI,signer); await(await u.approve(MARKET_ADDR,ethers.MaxUint256)).wait(); await(await marketContract.makeOffer(id, Number(r))).wait(); alert("Offer Sent"); loadData(); }
    async function accept(id) { if(confirm("Accept?")) await signAndRelay("acceptOffer",[id]); }
    async function repay(id) { if(confirm("Repay?")) await signAndRelay("repayLoan",[id]); }
    async function cancel(id) { if(confirm("Cancel?")) await signAndRelay("cancelRequest",[id]); }
    </script>
</body>
</html>
