<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyLoans | DeFi Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"'] }, colors: { bg: '#020408', surface: '#0B0D12', border: '#1E2129', brand: '#6366F1', success: '#10B981', danger: '#EF4444', warn: '#F59E0B' } } } }
    </script>
    <style>
        body{background:#020408;color:#E2E8F0}
        .hidden-tab{display:none!important}
        .btn-primary{background:#6366F1;color:white;transition:0.2s}.btn-primary:hover{background:#4F46E5}
        .btn-primary:disabled{opacity:0.5;cursor:not-allowed}
        .tab-btn { height: 100%; border-bottom: 2px solid transparent; color: #6B7280; padding: 0 10px; transition: all 0.2s; }
        .tab-active { border-bottom: 2px solid #6366F1; color: white; font-weight: bold; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.5; } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="h-20 border-b border-[#1E2129] flex items-center justify-between px-8 bg-[#020408]/90 backdrop-blur fixed w-full z-50">
        <div class="flex items-center gap-8">
            <span class="font-bold text-lg text-white"><span class="text-brand">▲</span> PolyLoans <span class="text-[10px] text-green-500 bg-green-900/20 px-2 py-1 rounded border border-green-900">LIVE</span></span>
            <div id="navTabs" class="hidden flex gap-6 text-sm font-medium h-20 items-end pb-0">
                <button onclick="switchTab('overview')" id="tab-overview" class="tab-btn tab-active">Overview</button>
                <button onclick="switchTab('borrow')" id="tab-borrow" class="tab-btn">Borrow</button>
                <button onclick="switchTab('lend')" id="tab-lend" class="tab-btn">Lend</button>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <input id="manualProxyInput" type="text" placeholder="Paste Proxy (Optional)" class="bg-[#0B0D12] border border-gray-800 rounded px-2 py-1 text-[10px] w-32 text-white focus:border-brand outline-none" onchange="window.manualProxy=this.value; connectWallet();">
            <div id="proxyDisplay" class="hidden text-[10px] font-mono text-gray-500">Proxy: <span id="pAddr">...</span></div>
            <div id="userAddr" class="hidden font-mono text-xs text-gray-400 bg-[#0B0D12] border border-[#1E2129] px-3 py-1.5 rounded-full"></div>
            <button id="btnConnect" onclick="connectWallet()" class="btn-primary px-4 py-2 rounded text-sm font-bold shadow-lg">Connect Wallet</button>
        </div>
    </nav>

    <main class="pt-28 p-8 max-w-7xl mx-auto w-full space-y-8 mb-20">
        <div id="view-overview" class="block space-y-6">
            <h2 class="text-xl font-bold text-white">Dashboard</h2>
            <div class="grid grid-cols-4 gap-6">
                <div class="bg-[#0B0D12] border border-[#1E2129] p-6 rounded-xl"><div class="text-xs text-gray-500 uppercase">My Debt</div><div class="text-2xl font-bold text-red-400" id="statBorrowed">$0.00</div></div>
                <div class="bg-[#0B0D12] border border-[#1E2129] p-6 rounded-xl"><div class="text-xs text-gray-500 uppercase">My Investments</div><div class="text-2xl font-bold text-emerald-400" id="statLent">$0.00</div></div>
            </div>
        </div>

        <div id="view-borrow" class="hidden-tab grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-4 bg-[#0B0D12] border border-[#1E2129] rounded-xl p-6 space-y-5 h-fit">
                <h2 class="font-bold text-white">New Request</h2>
                <div>
                    <div class="flex justify-between mb-1"><label class="text-xs font-bold text-gray-500">Asset (≥ $0.90)</label><label class="text-[10px] text-brand cursor-pointer"><input type="checkbox" onchange="toggleManualInput(this)"> Manual</label></div>
                    <select id="positionSelect" onchange="autoFillForm()" class="w-full bg-[#050608] border border-[#1E2129] rounded px-3 py-2 text-sm text-white outline-none"><option value="">Scanning...</option></select>
                    <input type="text" id="manualTokenId" placeholder="Paste Token ID" class="hidden w-full bg-[#050608] border border-[#1E2129] rounded px-3 py-2 text-sm text-white outline-none" oninput="document.getElementById('b_tokenId').value=this.value">
                    <div id="balanceDisplay" class="text-xs text-brand mt-1 h-4 font-mono"></div>
                </div>
                <input type="text" id="b_tokenId" class="hidden">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-xs text-gray-500">Shares</label><input type="number" id="b_shares" class="w-full bg-[#050608] border border-[#1E2129] rounded px-3 py-2 text-sm text-white" oninput="checkLTV()"></div>
                    <div><label class="text-xs text-gray-500">USDC</label><input type="number" id="b_principal" class="w-full bg-[#050608] border border-[#1E2129] rounded px-3 py-2 text-sm text-white" oninput="checkLTV()"></div>
                </div>
                <div><label class="text-xs text-gray-500 mb-2 block uppercase tracking-wider">Duration (MINUTES ⚠️)</label><input type="number" id="b_duration" class="w-full bg-[#050608] border border-[#1E2129] rounded px-3 py-2 text-sm text-white" placeholder="10"></div>
                
                <div id="ltvWarning" class="text-xs h-4 text-right font-mono"></div>
                <button onclick="handleCreateRequest()" id="btnCreate" disabled class="w-full btn-primary py-3 rounded font-bold text-sm">Sign & Post</button>
            </div>
            <div class="lg:col-span-8 space-y-6">
                <div class="bg-[#0B0D12] border border-[#1E2129] rounded-xl p-6"><h3 class="font-bold text-white mb-4">My Requests & Active Debts</h3><div id="borrowerLoans" class="space-y-4 text-sm text-gray-500">No active debts.</div></div>
                <div class="bg-[#0B0D12] border border-[#1E2129] rounded-xl p-6"><h3 class="font-bold text-white mb-4">Incoming Offers</h3><div id="borrowerOffers" class="grid gap-4 text-sm text-gray-500">No offers.</div></div>
                <div class="bg-[#0B0D12] border border-[#1E2129] rounded-xl p-6 opacity-60"><h3 class="font-bold text-gray-400 mb-4 text-xs uppercase">History (Repaid)</h3><div id="borrowerHistory" class="space-y-2 text-sm text-gray-600">No history found.</div></div>
            </div>
        </div>

        <div id="view-lend" class="hidden-tab space-y-6">
            <div class="bg-[#0B0D12] border border-[#1E2129] rounded-xl p-6">
                <div class="flex justify-between items-center mb-4"><h2 class="font-bold text-white">Market Feed</h2><button onclick="loadData()" class="text-xs text-brand">Refresh</button></div>
                <div id="marketFeed" class="space-y-4 text-gray-500 text-sm">Loading...</div>
            </div>
            <div class="bg-[#0B0D12] border border-[#1E2129] rounded-xl p-6"><h3 class="font-bold text-white mb-4">My Active Investments</h3><div id="lenderLoans" class="space-y-3 text-sm text-gray-500">No investments.</div></div>
        </div>
    </main>

    <div id="consoleLog" class="fixed bottom-0 left-0 w-full h-8 bg-black text-green-500 text-[10px] font-mono p-2 border-t border-gray-800 overflow-hidden whitespace-nowrap z-50">
        Initializing...
    </div>

    <script>
    // 🔥 CONTRACT ADDRESS 🔥
    const MARKET_ADDR = "0xc22E31721eFB50aDe758F41371d11d27B9402C7c"; 
    const USDC_ADDR = "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359"; 
    const POLY_ADDR = "0x4D97DCd97eC945f40cF65F87097ACe5EA0476045"; 
    const RENDER_API_URL = "https://polyloans-api.onrender.com"; 

    let signer, userAddress, marketContract, myProxy, ethProvider;
    const INFO_CACHE = {}; 
    const MARKET_ABI = ["function createRequest(uint256,uint256,uint256,uint256) external returns (uint256)", "function makeOffer(uint256,uint256) external returns (uint256)", "function acceptOffer(uint256) external", "function repayLoan(uint256) external", "function liquidateByTime(uint256) external", "function cancelRequest(uint256) external", "function requestExtension(uint256, uint256) external", "function acceptExtension(uint256) external", "function rejectExtension(uint256) external", "function buyoutLoan(uint256) external", "function cancelOffer(uint256) external", "function requests(uint256) view returns (address, uint256, uint256, uint256, uint256, bool, bool)", "function loans(uint256) view returns (address, uint256, uint256, uint256)", "function offers(uint256) view returns (uint256, address, uint256, bool)", "function extensions(uint256) view returns (bool, uint256, uint256, bool, uint256)", "function nextRequestId() view returns (uint256)", "function nextOfferId() view returns (uint256)"];
    const USDC_ABI = ["function approve(address, uint256) external", "function allowance(address, address) view returns (uint256)", "function balanceOf(address) view returns (uint256)"];
    const POLY_ABI = ["function setApprovalForAll(address, bool) external", "function isApprovedForAll(address, address) view returns (bool)"];

    function log(msg) { document.getElementById("consoleLog").innerText = `> ${msg}`; console.log(msg); }

    if (window.ethereum) { window.ethereum.on('accountsChanged', () => window.location.reload()); window.ethereum.on('chainChanged', () => window.location.reload()); }

    async function connectWallet() {
        if(!window.ethereum) return alert("Install Wallet");
        ethProvider = window.ethereum;
        try {
            await ethProvider.request({ method: 'eth_requestAccounts' });
            const provider = new ethers.BrowserProvider(ethProvider);
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();
            marketContract = new ethers.Contract(MARKET_ADDR, MARKET_ABI, signer);
            
            document.getElementById("btnConnect").innerText = userAddress.slice(0,6)+"...";
            document.getElementById("userAddr").innerText = userAddress;
            document.getElementById("userAddr").classList.remove("hidden");
            document.getElementById("btnConnect").style.display = "none";
            document.getElementById("navTabs").classList.remove("hidden");
            
            switchTab('borrow'); 
            await initProxy(); // 🔥 Wait for Proxy before loading data!
            loadData(); 
            setInterval(loadData, 4000); 
        } catch(e) { console.error(e); }
    }

    // 🔥 PROXY FINDER (BROWSER FIRST) 🔥
    async function initProxy() {
        log("Finding Proxy...");
        try {
            // 1. Try Server
            let r = await fetch(`${RENDER_API_URL}/get-nonce?user=${userAddress}`);
            let d = await r.json();
            if(d.proxy) { setProxy(d.proxy); return; }
        } catch(e) {}

        // 2. Try Browser (Gnosis)
        try {
            const checksumAddr = ethers.getAddress(userAddress); 
            const safeRes = await fetch(`https://safe-transaction-polygon.safe.global/api/v1/owners/${checksumAddr}/safes/`);
            const safeData = await safeRes.json();
            if (safeData.safes && safeData.safes.length > 0) {
                setProxy(safeData.safes[0]);
            } else {
                 document.getElementById("pAddr").innerText = "Not Found";
                 log("No Proxy found. Please trade on Polymarket once.");
            }
        } catch(e) { 
            log("Proxy Scan Error");
            document.getElementById("pAddr").innerText = "Error";
        }
    }

    function setProxy(addr) {
        window.myProxy = addr.toLowerCase();
        window.manualProxy = window.myProxy; 
        document.getElementById("pAddr").innerText = window.myProxy.slice(0,6)+"...";
        document.getElementById("proxyDisplay").classList.remove("hidden");
        log(`Proxy Found: ${window.myProxy}`);
        scanPortfolio(); // Load assets
        loadData(); // 🔥 RELOAD DATA NOW THAT WE KNOW WHO YOU ARE 🔥
    }

    function isMe(addr) { 
        if (!addr) return false; 
        const target = addr.toLowerCase(); 
        // Checks both EOA and Proxy
        return (target === userAddress.toLowerCase()) || (window.myProxy && target === window.myProxy); 
    }

    // --- DATA LOADER ---
    async function loadData() {
        if(!marketContract) return;
        const nextId = await marketContract.nextRequestId();
        const nextOff = await marketContract.nextOfferId();
        let feed="", bOffers="", bLoans="", lLoans="", bHist=""; 
        let requestOffersMap = {}; 
        
        // log(`Refreshing Data... (Max ID: ${nextId})`);

        for(let i=1; i<Number(nextOff); i++) {
            try {
                const off = await marketContract.offers(i); 
                if(off[3]) {
                    const reqKey = off[0].toString();
                    if(!requestOffersMap[reqKey]) requestOffersMap[reqKey] = [];
                    requestOffersMap[reqKey].push({id: i, lender: off[1], rate: Number(off[2])});
                }
            } catch(e){}
        }

        for(let i=Number(nextId)-1; i>=1; i--) {
            try {
                const req = await marketContract.requests(i); 
                if (req[1].toString() === "0") continue;
                const info = await getInfo(req[1]);
                const side = info.slug && info.slug.includes("no") ? "(NO)" : "(YES)"; 
                const link = `https://polymarket.com/event/${info.slug || 'unknown'}?tid=${req[1]}`;
                const reqKey = i.toString();
                const IAmBorrower = isMe(req[0]);
                const duration = Number(req[4]); // Seconds (from contract)

                let extData = null; try { const ext = await marketContract.extensions(i); if (ext[0]) extData = { duration: Number(ext[1]), reqTime: Number(ext[2]), isRejected: ext[3], rejTime: Number(ext[4]) }; } catch(e){}

                if (IAmBorrower) { 
                    if (req[5]) { 
                        if (!req[6]) { // PENDING
                            bLoans += `<div class="p-4 border border-gray-700 rounded bg-[#050608] mb-2"><div class="flex justify-between items-start mb-2"><div><div class="font-bold text-white text-sm"><span class="text-xs text-gray-500 mr-2">#${i}</span><a href="${link}" target="_blank" class="hover:text-brand hover:underline">${info.title}</a> <span class="text-success font-bold">${side}</span></div><div class="text-xs text-orange-400">Waiting for Lender...</div></div><button onclick="handleCancelRequest(${i})" class="text-red-400 text-xs border border-red-900 px-3 py-1 rounded">Cancel</button></div></div>`;
                            (requestOffersMap[reqKey]||[]).forEach(o => { 
                                const principal = Number(ethers.formatUnits(req[3],6));
                                const cost = calculateFixedInterest(principal, o.rate, duration); 
                                const total = principal + cost;
                                bOffers += `<div class="p-3 border border-green-900 rounded bg-[#051005] flex justify-between items-center mb-1"><div><div class="text-xs text-gray-400">Lender: ${o.lender.slice(0,6)}...</div><div class="text-sm font-bold text-green-400">${o.rate}% APR</div><div class="text-[10px] text-gray-500">Total: $${total.toFixed(4)}</div></div><button onclick="handleAcceptOffer(${o.id})" class="bg-green-600 px-3 py-1 rounded text-xs text-white">Accept</button></div>`; 
                            });
                        } else { // ACTIVE LOAN
                            const loan = await marketContract.loans(i);
                            const { start, rate } = parseLoanStruct(loan);
                            const end = start + duration; 
                            const now = Math.floor(Date.now()/1000);
                            const timeLeft = Math.floor((end-now)/60);
                            const princ = Number(ethers.formatUnits(req[3],6));
                            const totalDue = calculateTotalDue(princ, rate, duration).toFixed(6);

                            let autoExtBtn = "";
                            if (extData && !extData.isRejected && (now > extData.reqTime + 60)) autoExtBtn = `<button onclick="handleAutoExtend(${i})" class="bg-blue-600 text-white text-[10px] px-2 py-1 rounded">Auto-Extend</button>`;
                            
                            const timer = timeLeft < 0 ? "EXPIRED" : `${timeLeft}m ${Math.floor((end-now)%60)}s left`;
                            const timerClass = timeLeft < 0 ? "text-red-500 blink" : "text-green-400";
                            
                            // 🔥 Pass raw duration (Seconds) back to Repay, but /60 for Extend prompt
                            bLoans += `<div class="p-4 border border-green-900/50 rounded bg-[#050608] mb-2"><div class="flex justify-between items-center"><div><div class="font-bold text-white text-sm"><span class="text-xs text-gray-500 mr-2">#${i}</span>${info.title} <span class="text-success">${side}</span></div><div class="text-xs font-mono mt-1 ${timerClass}">Due: ${timer}</div><div class="text-xs text-gray-400">Fixed Owe: $${totalDue}</div></div><div class="flex flex-col gap-2 items-end"><button onclick="handleRepay(${i}, ${princ}, ${rate}, ${duration})" class="bg-brand text-black text-xs px-4 py-1 rounded font-bold">Repay Full</button><button onclick="handleExtend(${i})" class="text-[10px] text-gray-500 hover:text-white">Extend</button>${autoExtBtn}</div></div></div>`;
                        }
                    } else if (req[6]) { // HISTORY
                        bHist += `<div class="p-3 border border-gray-800 rounded bg-[#0B0D12] flex justify-between items-center mb-1"><div class="font-bold text-white text-xs truncate w-2/3">#${i} ${info.title} <span class="text-success">${side}</span></div><div class="text-[10px] text-green-500">✅ REPAID</div></div>`;
                    }
                }

                if (!IAmBorrower && req[5] && !req[6]) { // LENDER FEED
                    const competitors = requestOffersMap[reqKey] || [];
                    const principal = Number(ethers.formatUnits(req[3],6));
                    const durationMins = duration / 60; // Show Mins
                    let myExistingOffer = (requestOffersMap[reqKey] || []).find(o => isMe(o.lender));
                    let actionBtn = myExistingOffer ? `<button onclick="handleCancelOffer(${myExistingOffer.id})" class="bg-red-900 text-red-200 border border-red-500 px-4 py-1 rounded text-xs font-bold">Cancel</button>` : `<button onclick="makeOffer(${i}, ${principal})" class="bg-brand px-4 py-1 rounded text-xs text-white font-bold text-black">Offer</button>`;
                    feed += `<div class="p-4 border border-[#1E2129] rounded bg-[#050608] mb-2"><div class="mb-2"><div class="font-bold text-white text-sm"><span class="text-xs text-gray-500 mr-2">#${i}</span>${info.title} <span class="text-success">${side}</span></div><div class="flex gap-4 text-xs text-gray-500 mt-1"><span>Borrower: ${req[0].slice(0,6)}...</span><span>Ask: $${principal}</span><span>Dur: ${durationMins.toFixed(0)} Mins</span></div></div><div class="flex flex-col gap-1"><div class="flex gap-2"><input id="r_${i}" placeholder="APR %" class="w-16 bg-black text-white text-center text-xs rounded border border-gray-700" oninput="updateProfitPreview(${i}, ${principal}, ${durationMins})">${actionBtn}</div><div id="profit_${i}"></div></div>${competitors.length > 0 ? `<div class="mt-2 text-[10px] text-gray-600">Others: ${competitors.map(c=>c.rate+'%').join(', ')}</div>` : ''}</div>`;
                }

                if (!IAmBorrower && req[6] && req[5]) { // LENDER INVESTMENTS
                    const loan = await marketContract.loans(i);
                    const { lender, start, rate } = parseLoanStruct(loan);
                    if (isMe(lender)) { 
                        const end = start + duration;
                        const now = Math.floor(Date.now()/1000);
                        const canSeize = (!extData && now > end + 60) || (extData && extData.isRejected && now > extData.rejTime + 60); 
                        const timeLeft = Math.floor((end-now)/60);
                        const princ = Number(ethers.formatUnits(req[3],6));
                        const currentVal = calculateTotalDue(princ, rate, duration).toFixed(6);

                        let extHtml = "";
                        if (extData && !extData.isRejected) {
                            const extMins = Number(extData.duration) / 60;
                            extHtml = `<div class="mt-2 p-2 bg-blue-900/30 border border-blue-500/50 rounded flex justify-between items-center"><span class="text-xs text-blue-300">Request: +${extMins} Mins</span><div class="flex gap-2"><button onclick="handleAcceptExt(${i})" class="bg-blue-600 text-white text-[10px] px-2 py-1 rounded">Accept</button><button onclick="handleRejectExt(${i})" class="bg-red-600 text-white text-[10px] px-2 py-1 rounded">Reject</button></div></div>`;
                        } else if (extData && extData.isRejected) {
                             const buyoutLeft = (extData.rejTime + 60) - now;
                             if (buyoutLeft > 0) extHtml = `<div class="mt-2 text-[10px] text-yellow-500">In Buyout Window (${buyoutLeft}s)</div>`;
                        }

                        lLoans += `<div class="p-4 border border-emerald-900/30 rounded bg-[#050608] mb-2"><div class="font-bold text-white text-sm mb-1">#${i} ${info.title} <span class="text-success">${side}</span></div><div class="text-xs text-gray-400 mb-2">Borrower: ${req[0].slice(0,6)}</div><div class="flex justify-between items-center"><div><div class="text-xs font-mono text-emerald-400">Val: $${currentVal}</div></div>${canSeize ? `<button onclick="handleSeize(${i})" class="bg-red-600 hover:bg-red-500 text-white text-xs px-3 py-1 rounded font-bold animate-pulse">SEIZE</button>` : `<span class="text-xs text-gray-600">Active</span>`}</div>${extHtml}</div>`;
                    }
                }
                
                 // 🔥 BUYOUT FEED 🔥
                if (!IAmBorrower && req[6] && req[5] && extData && extData.isRejected) {
                    const now = Math.floor(Date.now()/1000);
                    if (now < extData.rejTime + 60) { // 1 Min Buyout Window
                        const principal = Number(ethers.formatUnits(req[3],6));
                        feed += `<div class="p-4 border border-yellow-500/50 rounded bg-[#1A1500] mb-2"><div class="mb-2"><div class="font-bold text-yellow-500 text-sm">🔥 BUYOUT OPPORTUNITY #${i}</div><div class="text-white text-xs">${info.title}</div><div class="text-[10px] text-gray-400">Principal: $${principal} | Ends in: ${(extData.rejTime+60) - now}s</div></div><button onclick="handleBuyout(${i}, ${principal})" class="w-full bg-yellow-600 text-black font-bold text-xs py-2 rounded">BUY LOAN (Pay Principal)</button></div>`;
                    }
                }
            } catch(e){ console.error(e) }
        }
        document.getElementById("marketFeed").innerHTML = feed || '<div class="text-center text-xs text-gray-500 py-4">No requests.</div>';
        document.getElementById("borrowerLoans").innerHTML = bLoans || '<div class="text-center text-xs text-gray-500 py-4">No active debts.</div>';
        document.getElementById("borrowerOffers").innerHTML = bOffers || '<div class="text-center text-xs text-gray-500 py-4">No offers.</div>';
        document.getElementById("lenderLoans").innerHTML = lLoans || '<div class="text-center text-xs text-gray-500 py-4">No investments.</div>';
        document.getElementById("borrowerHistory").innerHTML = bHist || '<div class="text-center text-xs text-gray-600">No history found.</div>';
    }

    // --- UTILS ---
    function switchTab(t) { ['overview','borrow','lend'].forEach(v => { document.getElementById(`view-${v}`).classList.add('hidden-tab'); document.getElementById(`tab-${v}`).classList.remove('tab-active'); }); document.getElementById(`view-${t}`).classList.remove('hidden-tab'); document.getElementById(`tab-${t}`).classList.add('tab-active'); }
    function calculateFixedInterest(principal, rate, durationSeconds) { return (principal * rate * durationSeconds) / (31536000 * 100); }
    function calculateTotalDue(principal, rate, durationSeconds) { return principal + calculateFixedInterest(principal, rate, durationSeconds); }
    function parseLoanStruct(loanArray) { return { lender: loanArray[0], start: Number(loanArray[1]), rate: Number(loanArray[2]), duration: Number(loanArray[3]) }; }
    function checkLTV() { const s = Number(document.getElementById("b_shares").value); const p = Number(document.getElementById("b_principal").value); const sel = document.getElementById("positionSelect"); const btn = document.getElementById("btnCreate"); const warn = document.getElementById("ltvWarning"); let price = 0.50; if(sel.selectedOptions.length > 0) price = Number(sel.selectedOptions[0].getAttribute("data-price")) || 0.50; if (price < 0.90) { warn.innerHTML = `<span class="text-danger font-bold">⚠️ Asset Price ($${price.toFixed(2)}) below $0.90 minimum!</span>`; btn.disabled = true; return; } const maxLoan = s * price * 0.50; if (p > maxLoan) { warn.innerHTML = `<span class="text-danger">Max Loan: $${maxLoan.toFixed(2)} (50% LTV)</span>`; btn.disabled = true; } else { warn.innerHTML = `<span class="text-success">LTV OK (Max: $${maxLoan.toFixed(2)})</span>`; btn.disabled = false; } }
    function autoFillForm() { const sel = document.getElementById("positionSelect"); if(sel.value) { const opt = sel.selectedOptions[0]; document.getElementById("b_tokenId").value = opt.value; document.getElementById("balanceDisplay").innerText = `Bal: ${opt.getAttribute("data-bal")} | Price: $${Number(opt.getAttribute("data-price")).toFixed(2)}`; checkLTV(); } }
    function toggleManualInput(cb) { document.getElementById("positionSelect").style.display = cb.checked ? "none" : "block"; document.getElementById("manualTokenId").style.display = cb.checked ? "block" : "none"; document.getElementById("b_tokenId").value = ""; }
    
    // --- ACTIONS ---
    async function signAndRelayGeneric(toAddr, data) { try { let url = `${RENDER_API_URL}/get-nonce?user=${userAddress}`; if(window.manualProxy) url += `&proxy=${window.manualProxy}`; const nonceRes = await fetch(url); const meta = await nonceRes.json(); const types = { SafeTx: [{type:"address",name:"to"},{type:"uint256",name:"value"},{type:"bytes",name:"data"},{type:"uint8",name:"operation"},{type:"uint256",name:"safeTxGas"},{type:"uint256",name:"baseGas"},{type:"uint256",name:"gasPrice"},{type:"address",name:"gasToken"},{type:"address",name:"refundReceiver"},{type:"uint256",name:"nonce"}] }; const message = { to: toAddr, value: 0, data, operation: 0, safeTxGas: 0, baseGas: 0, gasPrice: 0, gasToken: "0x0000000000000000000000000000000000000000", refundReceiver: "0x0000000000000000000000000000000000000000", nonce: meta.nonce }; const payload = JSON.stringify({ types: { EIP712Domain: [{name:"chainId",type:"uint256"}, {name:"verifyingContract",type:"address"}], SafeTx: types.SafeTx }, primaryType: "SafeTx", domain: { verifyingContract: meta.proxy, chainId: 137 }, message }); const sig = await ethProvider.request({ method: "eth_signTypedData_v4", params: [userAddress, payload] }); const res = await fetch(`${RENDER_API_URL}/relay-tx`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ proxy: meta.proxy, to: toAddr, data, signature: sig }) }); const json = await res.json(); if(!json.success) throw new Error(json.error); return json.txHash; } catch(e) { alert("Error: " + e.message); return null; } }
    async function signAndRelay(func, args) { const iface = new ethers.Interface(MARKET_ABI); const data = iface.encodeFunctionData(func, args); return await signAndRelayGeneric(MARKET_ADDR, data); }
    async function getInfo(id) { if(INFO_CACHE[id]) return INFO_CACHE[id]; try { const res = await fetch(`${RENDER_API_URL}/market-info?tokenId=${id}`); const d = await res.json(); INFO_CACHE[id]=d; return d; } catch{ return {title:"Unknown", slug:""}; } }
    async function scanPortfolio() { const select = document.getElementById("positionSelect"); try { let url = `${RENDER_API_URL}/portfolio?user=${userAddress}`; if(window.manualProxy) url += `&proxy=${window.manualProxy}`; const res = await fetch(url); const data = await res.json(); if (!data || data.length === 0) { select.innerHTML = '<option value="">No assets found</option>'; return; } select.innerHTML = '<option value="">-- Select Asset --</option>'; data.forEach(p => { const opt = document.createElement("option"); opt.value = p.asset; opt.setAttribute("data-bal", p.size); opt.setAttribute("data-price", p.livePrice); opt.text = `${p.title} (${Number(p.size).toFixed(2)})`; select.appendChild(opt); }); } catch(e) { select.innerHTML = '<option value="">Scan Failed</option>'; } }

    async function handleRepay(id, principal, rate, duration) { /* kept previous */ }
    async function handleSeize(id) { if(!confirm("Liquidate?")) return; await signAndRelay("liquidateByTime", [id]); alert("Seized!"); loadData(); }
    async function handleAcceptOffer(id) { if(!confirm("Accept?")) return; await signAndRelay("acceptOffer", [id]); loadData(); }
    async function handleCancelRequest(id) { if(!confirm("Cancel?")) return; await signAndRelay("cancelRequest", [id]); loadData(); }
    async function handleCancelOffer(id) { if(!confirm("Cancel Offer?")) return; const tx = await marketContract.cancelOffer(id); await tx.wait(); loadData(); }
    async function makeOffer(id) { const r = document.getElementById("r_"+id).value; if(!r) return alert("Enter Rate"); const u = new ethers.Contract(USDC_ADDR, USDC_ABI, signer); await(await u.approve(MARKET_ADDR,ethers.MaxUint256)).wait(); await(await marketContract.makeOffer(id, Number(r))).wait(); alert("Offer Sent!"); loadData(); }
    async function handleCreateRequest() { /* kept previous */ }
    async function handleAcceptExt(id) { if(!confirm("Accept Extension?")) return; await signAndRelay("acceptExtension", [id]); alert("Extended!"); loadData(); }
    async function handleRejectExt(id) { if(!confirm("Reject Extension?")) return; await signAndRelay("rejectExtension", [id]); alert("Rejected!"); loadData(); }
    async function handleAutoExtend(id) { if(!confirm("Auto-Extend?")) return; await signAndRelay("acceptExtension", [id]); alert("Auto-Extended!"); loadData(); }
    async function handleBuyout(id, princ) { if(!confirm(`Buyout Loan #${id}?`)) return; await signAndRelay("buyoutLoan", [id]); alert("Bought!"); loadData(); }
    async function handleExtend(id) { const d = prompt("New Duration (MINUTES):"); if(!d) return; await signAndRelay("requestExtension", [id, BigInt(d)]); alert("Requested!"); }
    </script>
