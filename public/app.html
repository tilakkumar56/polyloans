<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyLoans | DeFi Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"'], mono: ['"JetBrains Mono"'] }, colors: { bg: '#020408', surface: '#0B0D12', border: '#1E2129', brand: '#6366F1' } } } }
    </script>
    <style>
        body { background-color: #020408; color: #E2E8F0; }
        .panel { background: #0B0D12; border: 1px solid #1E2129; }
        .input-prem { background: #050608; border: 1px solid #1E2129; color: white; }
        .btn-brand { background: #6366F1; color: white; } .btn-brand:hover { background: #4F46E5; }
        .hidden-tab { display: none !important; }
        .tab-active { border-bottom: 2px solid #6366F1; color: white; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="h-16 border-b border-[#1E2129] flex items-center justify-between px-6 bg-[#020408]">
        <div class="flex items-center gap-8">
            <span class="font-bold text-lg text-white">PolyLoans <span class="text-[10px] text-brand bg-brand/10 px-1 rounded">BETA</span></span>
            <div id="navTabs" class="hidden flex gap-4 text-sm font-medium h-16 items-end pb-4">
                <button onclick="switchTab('overview')" id="tab-overview" class="tab-btn tab-active">Overview</button>
                <button onclick="switchTab('borrow')" id="tab-borrow" class="tab-btn">Borrow</button>
                <button onclick="switchTab('lend')" id="tab-lend" class="tab-btn">Lend</button>
            </div>
        </div>
        <div id="walletBox" class="flex items-center gap-4">
            <div id="userAddr" class="hidden flex items-center gap-2 bg-[#0B0D12] border border-[#1E2129] px-3 py-1.5 rounded-full">
                <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                <span id="addrText" class="font-mono text-xs text-gray-300">0x...</span>
            </div>
            <button id="btnConnect" onclick="connectWallet()" class="btn-brand px-4 py-2 rounded text-sm font-bold shadow-lg shadow-indigo-500/20">Connect Wallet</button>
        </div>
    </nav>

    <main class="p-6 max-w-7xl mx-auto w-full">

        <div id="view-overview" class="space-y-6">
            <h2 class="text-xl font-bold">Dashboard</h2>
            <div class="grid grid-cols-4 gap-6">
                <div class="panel p-6 rounded-xl"><div class="text-xs text-gray-500 uppercase">My Debt</div><div class="text-2xl font-bold text-red-400" id="statBorrowed">$0.00</div></div>
                <div class="panel p-6 rounded-xl"><div class="text-xs text-gray-500 uppercase">My Investments</div><div class="text-2xl font-bold text-emerald-400" id="statLent">$0.00</div></div>
                <div class="panel p-6 rounded-xl"><div class="text-xs text-gray-500 uppercase">Active Deals</div><div class="text-2xl font-bold text-white" id="statCount">0</div></div>
                <div class="panel p-6 rounded-xl"><div class="text-xs text-gray-500 uppercase">Positions</div><div class="text-2xl font-bold text-brand" id="statShares">0</div></div>
            </div>
        </div>

        <div id="view-borrow" class="hidden-tab grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-4 panel rounded-xl p-6 space-y-4">
                <h2 class="font-bold">New Request</h2>
                
                <div>
                    <label class="text-xs text-gray-500 block mb-1">Select Asset</label>
                    <select id="positionSelect" onchange="autoFillForm()" class="input-prem w-full rounded p-2 text-sm"></select>
                    <div id="balanceDisplay" class="text-xs text-brand mt-1 h-4 font-mono"></div>
                </div>

                <!-- Visible for debugging, make read-only -->
                <div>
                    <label class="text-[10px] text-gray-600 block">Token ID Check:</label>
                    <input type="text" id="b_tokenId" readonly class="bg-black/50 text-[10px] text-gray-500 w-full p-1 border border-gray-800 rounded">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-xs text-gray-500 block mb-1">Lock Shares</label><input type="number" id="b_shares" class="input-prem w-full rounded p-2 text-sm" oninput="checkLTV()"></div>
                    <div><label class="text-xs text-gray-500 block mb-1">Get USDC</label><input type="number" id="b_principal" class="input-prem w-full rounded p-2 text-sm" oninput="checkLTV()"></div>
                </div>
                
                <div id="ltvWarning" class="text-xs font-mono text-right h-4"></div>
                
                <div><label class="text-xs text-gray-500 block mb-1">Duration (Minutes)</label><input type="number" id="b_duration" class="input-prem w-full rounded p-2 text-sm" placeholder="e.g. 60"></div>

                <button onclick="handleCreateRequest()" id="btnCreate" disabled class="w-full btn-brand py-3 rounded font-bold text-sm">Sign & Post</button>
                <div id="b_status" class="text-center text-xs mt-2 text-gray-500"></div>
            </div>

            <div class="lg:col-span-8 space-y-6">
                <div class="panel rounded-xl p-6"><h2 class="font-bold mb-4">Incoming Offers</h2><div id="borrowerOffers" class="grid gap-4"><p class="text-gray-500 text-sm text-center py-4">No offers received yet.</p></div></div>
                <div class="panel rounded-xl p-6"><h2 class="font-bold mb-4">My Active Debts</h2><div id="borrowerLoans" class="space-y-4"><p class="text-gray-500 text-sm text-center py-4">No active debts.</p></div></div>
            </div>
        </div>

        <div id="view-lend" class="hidden-tab space-y-6">
            <div class="panel rounded-xl overflow-hidden p-4"><h2 class="font-bold mb-4">Market Feed</h2><div id="marketFeed" class="space-y-2"></div></div>
            <div class="panel rounded-xl p-6"><h2 class="font-bold mb-4">My Investments</h2><div id="lenderLoans" class="space-y-2"></div></div>
        </div>
    </main>

    <script>
    const MARKET_ADDR = "0x30672b8B427BD7277c8467221441e2D3Dbf833E4"; 
    const USDC_ADDR = "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359"; 
    const RENDER_API_URL = "https://polyloans-api.onrender.com"; 

    let signer, userAddress, marketContract;
    const INFO_CACHE = {}; 
    window.myProxy = null;

    const MARKET_ABI = ["function createRequest(uint256,uint256,uint256,uint256) external returns (uint256)","function makeOffer(uint256,uint256,uint256) external returns (uint256)","function acceptOffer(uint256) external","function repayLoan(uint256) external","function cancelRequest(uint256) external","function requests(uint256) view returns (address, uint256, uint256, uint256, uint256, bool, bool)","function loans(uint256) view returns (address, uint256, uint256, uint256)","function offers(uint256) view returns (uint256, address, uint256, bool)","function nextRequestId() view returns (uint256)","function nextOfferId() view returns (uint256)"];
    const USDC_ABI = ["function approve(address, uint256) external"];

    async function connectWallet() {
        let ethProvider = window.ethereum;
        if (!ethProvider) return alert("Install Rabby!");
        if (window.ethereum.providers?.length) ethProvider = window.ethereum.providers.find(p => p.isRabby) || window.ethereum.providers[0];

        try {
            await ethProvider.request({ method: 'eth_requestAccounts' });
            try { await ethProvider.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x89' }] }); } catch(e){}

            const provider = new ethers.BrowserProvider(ethProvider);
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();
            marketContract = new ethers.Contract(MARKET_ADDR, MARKET_ABI, signer);
            
            document.getElementById("addrText").innerText = userAddress.slice(0,6)+"...";
            document.getElementById("userAddr").classList.remove("hidden");
            document.getElementById("userAddr").classList.add("flex");
            document.getElementById("btnConnect").style.display = "none";
            document.getElementById("navTabs").classList.remove("hidden");
            
            switchTab('overview');
            await initProxy();
            scanPortfolio(); loadMarketFeed(); loadMyOffers(); loadMyLoans();
            setInterval(() => { loadMarketFeed(); loadMyLoans(); }, 3000);

        } catch(e) { alert("Connect Error: " + e.message); }
    }

    function switchTab(t) {
        ['overview','borrow','lend'].forEach(v => document.getElementById(`view-${v}`).classList.add('hidden-tab'));
        document.getElementById(`view-${t}`).classList.remove('hidden-tab');
    }

    async function signAndRelay(func, args) {
        const nonceRes = await fetch(`${RENDER_API_URL}/get-nonce?user=${userAddress}`);
        const meta = await nonceRes.json();
        if(!meta.proxy) return alert("No Proxy Found");

        const iface = new ethers.Interface(MARKET_ABI);
        const data = iface.encodeFunctionData(func, args);
        const domain = { verifyingContract: meta.proxy, chainId: 137 };
        // safeTxGas = 500000 Matches Server Force Logic
        const types = { SafeTx: [{type:"address",name:"to"},{type:"uint256",name:"value"},{type:"bytes",name:"data"},{type:"uint8",name:"operation"},{type:"uint256",name:"safeTxGas"},{type:"uint256",name:"baseGas"},{type:"uint256",name:"gasPrice"},{type:"address",name:"gasToken"},{type:"address",name:"refundReceiver"},{type:"uint256",name:"nonce"}] };
        const message = { to: MARKET_ADDR, value: 0, data, operation: 0, safeTxGas: 500000, baseGas: 0, gasPrice: 0, gasToken: "0x0000000000000000000000000000000000000000", refundReceiver: "0x0000000000000000000000000000000000000000", nonce: meta.nonce };

        const sig = await signer.signTypedData(domain, types, message);
        const res = await fetch(`${RENDER_API_URL}/relay-tx`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ proxy: meta.proxy, to: MARKET_ADDR, data, signature: sig }) });
        const json = await res.json();
        if(!json.success) throw new Error(json.error);
        return json.txHash;
    }

    async function handleCreateRequest() {
        const id = document.getElementById("b_tokenId").value;
        const s = document.getElementById("b_shares").value;
        const p = document.getElementById("b_principal").value;
        const d = document.getElementById("b_duration").value;
        
        // CHECK ID NOT ZERO
        if(!id || id === "0") return alert("Invalid Asset. Please select a valid position.");

        document.getElementById("b_status").innerText = "⏳ Signing...";
        try {
            const tx = await signAndRelay('createRequest', [id, BigInt(Math.floor(s*1e6)), BigInt(Math.floor(p*1e6)), BigInt(d*60)]);
            if(tx) { document.getElementById("b_status").innerHTML = `<span class="text-emerald-400">✅ Posted!</span>`; setTimeout(() => { loadMarketFeed(); loadMyLoans(); }, 2000); }
        } catch(e) { document.getElementById("b_status").innerText = "❌ " + e.message; }
    }

    // --- MARKET FEED: SHOW MY REQUESTS TOO (Marked as Yours) ---
    async function loadMarketFeed() {
        const tbody = document.getElementById("marketFeed");
        const nextId = await marketContract.nextRequestId();
        let html = "";
        
        for(let i=Number(nextId)-1; i>=1; i--) {
            try {
                const req = await marketContract.requests(i);
                // Active, Not Loan
                if(req[5] && !req[6]) {
                    const info = await getInfo(req[1]);
                    const isMine = (req[0].toLowerCase() === window.myProxy);
                    
                    let action = isMine 
                        ? `<span class="text-xs bg-gray-800 text-gray-400 px-2 py-1 rounded">Your Request</span>` 
                        : `<div class="flex gap-2"><input id="rate_${i}" placeholder="%" class="w-12 bg-black border border-gray-700 text-xs p-1 rounded text-center"><button onclick="makeOffer(${i})" class="bg-brand px-3 py-1 rounded text-xs text-white">Offer</button></div>`;

                    html += `<tr class="border-b border-[#1E2129] hover:bg-[#0B0D12]"><td class="p-4"><div class="font-bold text-white">${info.title}</div></td><td class="p-4 text-right text-emerald-400 font-mono">${ethers.formatUnits(req[2],6)}</td><td class="p-4 text-right text-white font-mono">$${ethers.formatUnits(req[3],6)}</td><td class="p-4 text-right text-gray-400">${(Number(req[4])/60).toFixed(0)}m</td><td class="p-4 text-right">${action}</td></tr>`;
                }
            } catch(e){}
        }
        tbody.innerHTML = html || '<tr><td colspan="5" class="p-8 text-center text-gray-500">No requests found.</td></tr>';
    }

    async function initProxy() { try{ const r=await fetch(`${RENDER_API_URL}/get-nonce?user=${userAddress}`); const d=await r.json(); window.myProxy=d.proxy ? d.proxy.toLowerCase() : null; }catch(e){} }
    async function getInfo(id) { if(INFO_CACHE[id]) return INFO_CACHE[id]; try { const res = await fetch(`${RENDER_API_URL}/market-info?tokenId=${id}`); const data = await res.json(); INFO_CACHE[id]=data; return data; } catch { return {title:"Unknown"};} }
    async function scanPortfolio() {
        const select = document.getElementById("positionSelect");
        try {
            const res = await fetch(`${RENDER_API_URL}/portfolio?user=${userAddress}`);
            const data = await res.json();
            if (data.length === 0) { select.innerHTML = '<option>No assets found</option>'; return; }
            select.innerHTML = '<option value="">-- Select Asset --</option>';
            data.forEach(p => {
                const opt = document.createElement("option");
                opt.value = p.asset; opt.setAttribute("data-bal", p.size); opt.setAttribute("data-price", p.livePrice);
                opt.text = `${p.title} (${p.outcome})`; select.appendChild(opt);
            });
        } catch(e) { select.innerHTML = '<option>⚠️ Error Scanning</option>'; }
    }
    function autoFillForm() { const sel = document.getElementById("positionSelect"); if(sel.value) { const opt = sel.selectedOptions[0]; document.getElementById("b_tokenId").value = opt.value; document.getElementById("balanceDisplay").innerText = `Bal: ${opt.getAttribute("data-bal")} | Price: $${Number(opt.getAttribute("data-price")).toFixed(2)}`; } }
    function checkLTV() { const s = Number(document.getElementById("b_shares").value); const p = Number(document.getElementById("b_principal").value); const opt = document.getElementById("positionSelect").selectedOptions[0]; const price = opt ? Number(opt.getAttribute("data-price")) : 0.5; const limit = s * price * 0.5; if(p > limit) { document.getElementById("ltvWarning").innerText = `Max: $${limit.toFixed(2)}`; document.getElementById("btnCreate").disabled = true; } else { document.getElementById("ltvWarning").innerText = "LTV OK"; document.getElementById("btnCreate").disabled = false; } }

    async function makeOffer(id) { const r=document.getElementById("rate_"+id).value; const u=new ethers.Contract(USDC_ADDR,USDC_ABI,signer); await(await u.approve(MARKET_ADDR,ethers.MaxUint256)).wait(); await(await marketContract.makeOffer(id,Number(r))).wait(); alert("Offer Sent!"); loadMarketFeed(); }
    async function handleAcceptOffer(id) { if(confirm("Accept?")) if(await signAndRelay("acceptOffer",[id])) alert("Deal Active!"); }
    async function handleRepay(id) { if(confirm("Repay?")) if(await signAndRelay("repayLoan",[id])) alert("Repaid!"); }
    async function handleCancelRequest(id) { if(confirm("Cancel?")) if(await signAndRelay("cancelRequest",[id])) alert("Cancelled!"); }
    
    // Stub functions for My Loans / Offers loading (add full logic similar to previous iteration)
    async function loadMyOffers() { /* ... see previous code ... */ }
    async function loadMyLoans() { /* ... see previous code ... */ }

    </script>
</body>
</html>
