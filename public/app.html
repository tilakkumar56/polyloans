<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyLoans | DeFi Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"'],mono:['"JetBrains Mono"']},colors:{bg:'#020408',surface:'#0B0D12',border:'#1E2129',brand:'#6366F1'}}}}; </script>
    <style>
        body{background:#020408;color:#E2E8F0} .panel{background:#0B0D12;border:1px solid #1E2129} .input-prem{background:#050608;border:1px solid #1E2129;color:#FFF} .hidden-tab{display:none !important} 
        .tab-btn{border-bottom:2px solid transparent;color:#6B7280;width:100px;text-align:center}.tab-active{border-bottom:2px solid #6366F1;color:white;font-weight:bold}
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- NAV -->
    <nav class="h-16 border-b border-[#1E2129] flex items-center justify-between px-6 bg-[#020408] fixed w-full top-0 z-50">
        <div class="flex items-center gap-8"><span class="font-bold text-lg text-white">PolyLoans</span><div id="navTabs" class="hidden flex gap-4 text-sm font-medium"><button onclick="switchTab('overview')" id="tab-overview" class="tab-btn tab-active">Overview</button><button onclick="switchTab('borrow')" id="tab-borrow" class="tab-btn">Borrow</button><button onclick="switchTab('lend')" id="tab-lend" class="tab-btn">Lend</button></div></div>
        <div id="walletBox" class="flex items-center gap-4"><div id="userAddr" class="hidden flex items-center gap-2 bg-[#0B0D12] border border-[#1E2129] px-3 py-1.5 rounded-full"><span id="addrText" class="font-mono text-xs text-gray-300">...</span></div><button id="btnConnect" onclick="connectWallet()" class="bg-[#6366F1] px-4 py-2 rounded text-sm font-bold text-white">Connect Wallet</button></div>
    </nav>

    <!-- MAIN -->
    <main class="pt-24 p-6 max-w-7xl mx-auto w-full">

        <!-- OVERVIEW -->
        <div id="view-overview" class="space-y-6">
            <h2 class="text-xl font-bold">Account Overview</h2>
            <div class="grid grid-cols-4 gap-6">
                <div class="panel p-6 rounded-xl"><div class="text-xs text-gray-500 uppercase">My Debt</div><div class="text-2xl font-bold text-red-400" id="statBorrowed">$0.00</div></div>
                <div class="panel p-6 rounded-xl"><div class="text-xs text-gray-500 uppercase">My Investments</div><div class="text-2xl font-bold text-emerald-400" id="statLent">$0.00</div></div>
                <div class="panel p-6 rounded-xl"><div class="text-xs text-gray-500 uppercase">Active Deals</div><div class="text-2xl font-bold text-white" id="statCount">0</div></div>
                <div class="panel p-6 rounded-xl"><div class="text-xs text-gray-500 uppercase">Positions</div><div class="text-2xl font-bold text-brand" id="statShares">0</div></div>
            </div>
        </div>

        <!-- BORROW -->
        <div id="view-borrow" class="hidden-tab grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-4 panel rounded-xl p-6 space-y-4 h-fit sticky top-24">
                <h2 class="font-bold text-white">New Request</h2>
                <select id="positionSelect" onchange="autoFillForm()" class="input-prem w-full rounded p-2 text-sm"></select>
                <div id="balanceDisplay" class="text-xs text-brand h-4"></div>
                <input type="text" id="b_tokenId" class="hidden">
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="b_shares" placeholder="Shares" class="input-prem w-full rounded p-2 text-sm" oninput="checkLTV()">
                    <input type="number" id="b_principal" placeholder="USDC" class="input-prem w-full rounded p-2 text-sm" oninput="checkLTV()">
                </div>
                <div id="ltvWarning" class="text-xs text-right h-4 font-mono"></div>
                <input type="number" id="b_duration" class="input-prem w-full rounded p-2 text-sm" placeholder="Mins">
                <button onclick="handleCreateRequest()" id="btnCreate" disabled class="w-full bg-[#6366F1] py-3 rounded font-bold text-sm text-white">Sign & Post</button>
                <div id="b_status" class="text-center text-xs mt-2 text-gray-500"></div>
            </div>
            <div class="lg:col-span-8 space-y-6">
                <div class="panel rounded-xl p-6"><h2 class="font-bold mb-4">Incoming Offers</h2><div id="borrowerOffers" class="grid gap-4"><p class="text-gray-500 text-sm text-center py-4">No offers.</p></div></div>
                <div class="panel rounded-xl p-6"><h2 class="font-bold mb-4">My Requests / Debts</h2><div id="borrowerLoans" class="space-y-4"><p class="text-gray-500 text-sm text-center py-4">No active debts.</p></div></div>
            </div>
        </div>

        <!-- LEND -->
        <div id="view-lend" class="hidden-tab space-y-6">
            <div class="panel rounded-xl overflow-hidden p-4"><h2 class="font-bold mb-4">Market Feed</h2><div id="marketFeed"></div></div>
            <div class="panel rounded-xl p-6"><h2 class="font-bold mb-4">My Investments</h2><div id="lenderLoans"><p class="text-gray-500 text-sm text-center py-4">No investments.</p></div></div>
        </div>
    </main>

    <script>
    const MARKET_ADDR = "0x30672b8B427BD7277c8467221441e2D3Dbf833E4"; 
    const USDC_ADDR = "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359"; 
    const RENDER_API_URL = "https://polyloans-api.onrender.com"; 

    let signer, userAddress, marketContract, myProxy;
    const INFO_CACHE = {}; 

    const MARKET_ABI = ["function createRequest(uint256,uint256,uint256,uint256) external returns (uint256)","function makeOffer(uint256,uint256,uint256) external returns (uint256)","function acceptOffer(uint256) external","function repayLoan(uint256) external","function cancelRequest(uint256) external","function requests(uint256) view returns (address, uint256, uint256, uint256, uint256, bool, bool)","function loans(uint256) view returns (address, uint256, uint256, uint256)","function offers(uint256) view returns (uint256, address, uint256, bool)","function nextRequestId() view returns (uint256)","function nextOfferId() view returns (uint256)"];
    const USDC_ABI = ["function approve(address, uint256) external"];

    async function connectWallet() {
        if(!window.ethereum) return alert("Install Rabby!");
        const provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = await provider.getSigner();
        userAddress = await signer.getAddress();
        marketContract = new ethers.Contract(MARKET_ADDR, MARKET_ABI, signer);
        
        document.getElementById("addrText").innerText = userAddress.slice(0,6)+"...";
        document.getElementById("userAddr").classList.remove("hidden");
        document.getElementById("userAddr").classList.add("flex");
        document.getElementById("btnConnect").style.display = "none";
        document.getElementById("navTabs").classList.remove("hidden");
        
        switchTab('overview');
        await initProxy();
        
        scanPortfolio(); loadData(); setInterval(loadData, 2000);
    }

    // --- FIX: ROBUST OWNERSHIP CHECK ---
    function isMe(address) {
        if (!address) return false;
        // Normalize everything to lowercase for safety
        const target = address.toLowerCase();
        const me = userAddress.toLowerCase();
        const proxy = window.myProxy ? window.myProxy.toLowerCase() : "";
        return target === me || target === proxy;
    }

    async function loadData() {
        const nextId = await marketContract.nextRequestId();
        const nextOff = await marketContract.nextOfferId();
        let feed="", bOffers="", bLoans="", lLoans="", count=0;

        for(let i=1; i<Number(nextId); i++) {
            try {
                const req = await marketContract.requests(i);
                // req: [borrower, tokenId, shares, principal, duration, isActive, isLoan]
                
                // --- 1. PENDING REQUEST (Mine) ---
                if(req[5] && !req[6] && isMe(req[0])) {
                    const info = await getInfo(req[1]);
                    bLoans += `<div class="p-4 border border-dashed border-gray-700 rounded-xl bg-[#0B0D12] opacity-75 mb-2"><div class="flex justify-between mb-2"><span class="font-bold text-white text-sm truncate w-3/4">${info.title}</span><span class="text-xs bg-orange-500/20 text-orange-400 px-2 rounded">Pending (#${i})</span></div><div class="text-xs text-gray-500 mb-3">Locked: ${ethers.formatUnits(req[2],6)} shares</div><button onclick="handleCancelRequest(${i})" class="w-full border border-red-900 text-red-400 py-2 rounded text-xs hover:bg-red-900/20">Cancel Request</button></div>`;
                    count++;
                }

                // --- 2. MARKET FEED (Others) ---
                else if(req[5] && !req[6] && !isMe(req[0])) {
                    const info = await getInfo(req[1]);
                    feed += `<div class="p-4 border border-[#1E2129] rounded-xl bg-[#0B0D12] flex justify-between items-center mb-2"><div><div class="font-bold text-sm text-white mb-1">${info.title}</div><div class="text-xs text-gray-500">Loan #${i} | Ask: $${ethers.formatUnits(req[3],6)}</div></div><div class="flex gap-2"><input id="rate_${i}" placeholder="%" class="w-12 bg-black border border-gray-700 text-xs p-1 rounded text-center"><button onclick="makeOffer(${i})" class="bg-blue-600 px-3 py-1 rounded text-xs text-white">Offer</button></div></div>`;
                }

                // --- 3. ACTIVE LOAN ---
                else if(req[6]) {
                    const loan = await marketContract.loans(i);
                    const info = await getInfo(req[1]);
                    const princ = ethers.formatUnits(req[3],6);

                    if(isMe(req[0])) { // My Debt
                        bLoans += `<div class="p-4 border border-[#1E2129] rounded-xl bg-[#0B0D12] mb-2"><div class="flex justify-between mb-2"><span class="font-bold text-white text-sm">${info.title}</span><span class="text-xs bg-emerald-900 text-emerald-200 px-2 rounded">Active</span></div><div class="text-xs text-gray-400">Owed: $${princ}</div><button onclick="handleRepay(${i})" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded font-bold text-xs mt-3">Repay Loan</button></div>`;
                        count++;
                    }
                }
            } catch(e){}
        }

        // OFFERS
        for(let i=1; i<Number(nextOff); i++) {
            try {
                const off = await marketContract.offers(i);
                if(off[3]) {
                    const req = await marketContract.requests(off[0]);
                    if(isMe(req[0])) { // Offer for ME
                        const info = await getInfo(req[1]);
                        bOffers += `<div class="p-4 border border-green-900/30 rounded-xl bg-[#051105] flex justify-between items-center mb-2"><div><div class="text-[10px] text-green-400 uppercase">Offer</div><div class="font-bold text-sm text-white">${info.title}</div><div class="text-xs text-emerald-400">Rate: ${Number(off[2])}%</div></div><button onclick="handleAcceptOffer(${i})" class="bg-green-600 px-4 py-2 rounded text-xs font-bold text-white">Accept</button></div>`;
                    }
                }
            } catch(e){}
        }

        document.getElementById("borrowerLoans").innerHTML = bLoans || '<p class="text-gray-500 text-sm text-center">No active debts.</p>';
        document.getElementById("marketFeed").innerHTML = feed || '<p class="text-gray-500 text-sm text-center">No requests.</p>';
        document.getElementById("borrowerOffers").innerHTML = bOffers || '<p class="text-gray-500 text-sm text-center">No offers.</p>';
        document.getElementById("statCount").innerText = count;
    }

    // --- UTILS ---
    async function initProxy() { try{ const r=await fetch(`${RENDER_API_URL}/get-nonce?user=${userAddress}`); const d=await r.json(); window.myProxy=d.proxy; }catch(e){} }
    async function getInfo(id) { if(INFO_CACHE[id]) return INFO_CACHE[id]; try { const r = await fetch(`${RENDER_API_URL}/market-info?tokenId=${id}`); const d = await r.json(); INFO_CACHE[id]=d; return d; } catch{ return {title:"Unknown"};} }
    function switchTab(t) { ['overview','borrow','lend'].forEach(v => document.getElementById(`view-${v}`).classList.add('hidden-tab')); document.getElementById(`view-${t}`).classList.remove('hidden-tab'); }
    
    // --- ACTIONS ---
    async function signAndRelay(func, args) {
        // [Same Signing Logic as before - omitted for brevity but include in final file]
        // ... Copy from previous response ...
        const nonceRes = await fetch(`${RENDER_API_URL}/get-nonce?user=${userAddress}`);
        const meta = await nonceRes.json();
        const iface = new ethers.Interface(MARKET_ABI);
        const data = iface.encodeFunctionData(func, args);
        const domain = { verifyingContract: meta.proxy, chainId: 137 };
        const types = { SafeTx: [{type:"address",name:"to"},{type:"uint256",name:"value"},{type:"bytes",name:"data"},{type:"uint8",name:"operation"},{type:"uint256",name:"safeTxGas"},{type:"uint256",name:"baseGas"},{type:"uint256",name:"gasPrice"},{type:"address",name:"gasToken"},{type:"address",name:"refundReceiver"},{type:"uint256",name:"nonce"}] };
        const message = { to: MARKET_ADDR, value: 0, data, operation: 0, safeTxGas: 0, baseGas: 0, gasPrice: 0, gasToken: "0x0000000000000000000000000000000000000000", refundReceiver: "0x0000000000000000000000000000000000000000", nonce: meta.nonce };
        const sig = await signer.signTypedData(domain, types, message);
        const res = await fetch(`${RENDER_API_URL}/relay-tx`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ proxy: meta.proxy, to: MARKET_ADDR, data, signature: sig }) });
        const json = await res.json();
        if(!json.success) throw new Error(json.error);
        return json.txHash;
    }

    async function handleCreateRequest() {
        const id=document.getElementById("b_tokenId").value; const s=document.getElementById("b_shares").value; const p=document.getElementById("b_principal").value; const d=document.getElementById("b_duration").value;
        document.getElementById("b_status").innerText = "⏳ Signing...";
        const tx = await signAndRelay('createRequest', [id, BigInt(Math.floor(s*1e6)), BigInt(Math.floor(p*1e6)), BigInt(d*60)]);
        if(tx) { document.getElementById("b_status").innerText = "✅ Posted!"; setTimeout(loadData, 2000); }
    }

    async function makeOffer(id) {
        const r = document.getElementById("rate_"+id).value;
        const u = new ethers.Contract(USDC_ADDR, USDC_ABI, signer);
        await(await u.approve(MARKET_ADDR,ethers.MaxUint256)).wait();
        await(await marketContract.makeOffer(id, Number(r))).wait();
        alert("Offer Sent!"); loadData();
    }
    async function handleAcceptOffer(id) { if(confirm("Accept?")) if(await signAndRelay("acceptOffer", [id])) alert("Deal Active!"); }
    async function handleRepay(id) { if(confirm("Repay?")) if(await signAndRelay("repayLoan", [id])) alert("Repaid!"); }
    async function handleCancelRequest(id) { if(confirm("Cancel?")) if(await signAndRelay("cancelRequest", [id])) alert("Cancelled!"); }

    // [Scan Portfolio & LTV Logic same as previous]
    async function scanPortfolio() {
        const select = document.getElementById("positionSelect");
        try {
            const res = await fetch(`${RENDER_API_URL}/portfolio?user=${userAddress}`);
            const data = await res.json();
            if (data.length === 0) { select.innerHTML = '<option>No assets found</option>'; return; }
            select.innerHTML = '<option value="">-- Select Asset --</option>';
            data.forEach(p => {
                const opt = document.createElement("option");
                opt.value = p.asset; opt.setAttribute("data-bal", p.size); opt.setAttribute("data-price", p.livePrice);
                opt.text = `${p.title} (${p.outcome})`; select.appendChild(opt);
            });
            document.getElementById("statShares").innerText = data.length;
        } catch(e) { select.innerHTML = '<option>⚠️ Error Scanning</option>'; }
    }
    function autoFillForm() { const sel = document.getElementById("positionSelect"); if(sel.value) { const opt = sel.selectedOptions[0]; document.getElementById("b_tokenId").value = opt.value; document.getElementById("priceDisplay").innerText = `Bal: ${opt.getAttribute("data-bal")} | Price: $${Number(opt.getAttribute("data-price")).toFixed(2)}`; } }
    function checkLTV() { const s = Number(document.getElementById("b_shares").value); const p = Number(document.getElementById("b_principal").value); const opt = document.getElementById("positionSelect").selectedOptions[0]; const price = opt ? Number(opt.getAttribute("data-price")) : 0.5; const limit = s * price * 0.5; if(p > limit) { document.getElementById("ltvWarning").innerText = `Max: $${limit.toFixed(2)}`; document.getElementById("btnCreate").disabled = true; } else { document.getElementById("ltvWarning").innerText = "LTV OK"; document.getElementById("btnCreate").disabled = false; } }

    </script>
</body>
</html>
