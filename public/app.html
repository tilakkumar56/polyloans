<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyLoans | Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.11.1/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], mono: ['"JetBrains Mono"', 'monospace'] },
                    colors: { bg: '#020408', surface: '#0B0D12', border: '#1E2129', brand: '#6366F1' },
                    animation: { 'slide-in': 'slideIn 0.3s ease-out', 'fade-out': 'fadeOut 0.3s ease-in forwards' },
                    keyframes: {
                        slideIn: { '0%': { transform: 'translateX(100%)', opacity: '0' }, '100%': { transform: 'translateX(0)', opacity: '1' } },
                        fadeOut: { '0%': { opacity: '1' }, '100%': { opacity: '0' } }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #020408; color: #E2E8F0; }
        .glass-panel { background: #0B0D12; border: 1px solid #1E2129; }
        .glass-input { background: #050608; border: 1px solid #1E2129; color: white; transition: all 0.2s; }
        .glass-input:focus { border-color: #6366F1; outline: none; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
        .tab-active { border-bottom: 2px solid #6366F1; color: white; }
        .tab-inactive { color: #6B7280; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.5; } }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <nav class="border-b border-gray-800 bg-[#020408]/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 font-bold text-white hover:opacity-80 transition">
                <div class="w-6 h-6 bg-indigo-600 rounded flex items-center justify-center text-xs">▲</div>
                PolyLoans
            </a>
            
            <div class="hidden md:flex h-full gap-6">
                <button onclick="setTab('borrow')" id="tab-borrow" class="tab-active h-full px-2 text-sm font-bold border-b-2 border-transparent hover:text-white transition">Borrow</button>
                <button onclick="setTab('lend')" id="tab-lend" class="tab-inactive h-full px-2 text-sm font-bold border-b-2 border-transparent hover:text-white transition">Lend / Buyout</button>
                <button onclick="setTab('portfolio')" id="tab-portfolio" class="tab-inactive h-full px-2 text-sm font-bold border-b-2 border-transparent hover:text-white transition">My Portfolio</button>
            </div>

            <button id="connectBtn" onclick="connectWallet()" class="bg-white text-black px-4 py-2 rounded-lg text-sm font-bold hover:bg-gray-200 transition">
                Connect Wallet
            </button>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl mx-auto px-6 py-10 w-full">
        
        <div id="view-borrow" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4 space-y-6">
                <div class="glass-panel p-6 rounded-xl sticky top-24">
                    <h2 class="text-xl font-bold text-white mb-1">Create Request</h2>
                    <p class="text-sm text-gray-500 mb-6">Pledge shares for instant USDC.</p>

                    <div class="space-y-4">
                        <div>
                            <label class="text-xs font-mono text-gray-500 uppercase flex justify-between">
                                <span>Token ID</span>
                                <span class="text-indigo-400 cursor-pointer" onclick="toggleScan()">Scan Wallet</span>
                            </label>
                            
                            <select id="scanSelect" onchange="autoFill()" class="hidden glass-input w-full px-4 py-3 rounded-lg mt-1 font-mono text-xs">
                                <option>Loading...</option>
                            </select>
                            <input type="text" id="tokenId" placeholder="e.g. 2349..." class="glass-input w-full px-4 py-3 rounded-lg mt-1 font-mono text-sm">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs font-mono text-gray-500 uppercase">Shares</label>
                                <input type="number" id="shares" placeholder="1000" class="glass-input w-full px-4 py-3 rounded-lg mt-1 font-mono text-sm" oninput="checkLTV()">
                            </div>
                            <div>
                                <label class="text-xs font-mono text-gray-500 uppercase">USDC</label>
                                <input type="number" id="principal" placeholder="500" class="glass-input w-full px-4 py-3 rounded-lg mt-1 font-mono text-sm" oninput="checkLTV()">
                            </div>
                        </div>

                        <div>
                            <label class="text-xs font-mono text-gray-500 uppercase">Duration (Days)</label>
                            <input type="number" id="duration" placeholder="14" class="glass-input w-full px-4 py-3 rounded-lg mt-1 font-mono text-sm">
                        </div>

                        <div id="ltv-indicator" class="text-right text-[10px] font-mono text-gray-500 h-4"></div>
                        
                        <button onclick="createRequest()" id="btn-create" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg transition mt-2">
                            Create Request
                        </button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-bold text-white">My Active Requests</h2>
                    <button onclick="loadData()" class="text-xs text-indigo-400 hover:text-white transition">↻ Refresh</button>
                </div>
                <div id="my-requests-feed" class="space-y-4">
                    <div class="text-center py-10 text-gray-800 border border-gray-800 border-dashed rounded-xl">Connect wallet to see your requests</div>
                </div>
            </div>
        </div>

        <div id="view-lend" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-12">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h2 class="text-xl font-bold text-white">Market Feed</h2>
                        <p class="text-xs text-gray-500">Fund loans or Buyout distressed debt</p>
                    </div>
                    <button onclick="loadData()" class="text-xs text-indigo-400 hover:text-white transition">↻ Refresh</button>
                </div>
                <div id="market-feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                </div>
            </div>
        </div>

        <div id="view-portfolio" class="hidden space-y-6">
            <h2 class="text-xl font-bold text-white">My Investments</h2>
            <div id="my-investments" class="space-y-4"></div>
        </div>

    </main>

    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <script>
        const CONTRACT_ADDRESS = "0xDDd7902d60B26190c909276Dac6391D991E0B8E5";
        const USDC_ADDRESS = "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359";
        const POLY_ADDRESS = "0x4D97DCd97eC945f40cF65F87097ACe5EA0476045";
        const RENDER_API = "https://polyloans-api.onrender.com";

        const ABI = [
            "function createRequest(uint256,uint256,uint256,uint256)",
            "function makeOffer(uint256,uint256)",
            "function acceptOffer(uint256)",
            "function repayLoan(uint256)",
            "function liquidateByTime(uint256)",
            "function cancelRequest(uint256)",
            "function requestExtension(uint256, uint256)",
            "function acceptExtension(uint256)",
            "function rejectExtension(uint256)",
            "function buyoutLoan(uint256)",
            "function nextRequestId() view returns (uint256)",
            "function nextOfferId() view returns (uint256)",
            "function requests(uint256) view returns (address, uint256, uint256, uint256, uint256, bool, bool)",
            "function loans(uint256) view returns (address, uint256, uint256, uint256)",
            "function offers(uint256) view returns (uint256, address, uint256, bool)",
            "function extensions(uint256) view returns (bool, uint256, uint256, bool, uint256)"
        ];
        const TOKEN_ABI = ["function approve(address, uint256) public returns (bool)", "function allowance(address, address) view returns (uint256)", "function setApprovalForAll(address, bool)", "function isApprovedForAll(address, address) view returns (bool)"];

        let provider, signer, contract, userAddress;
        let CACHE_INFO = {};

        function showToast(title, msg, type='success') {
            const c = document.getElementById('toast-container');
            let color = type==='error'?'border-red-500 text-red-500':(type==='info'?'border-blue-500 text-blue-500':'border-green-500 text-green-500');
            const el = document.createElement('div');
            el.className = `pointer-events-auto bg-[#0B0D12] border-l-4 ${color.split(' ')[0]} text-white p-4 rounded shadow-2xl min-w-[300px] flex gap-3 items-start animate-slide-in`;
            el.innerHTML = `<div class="${color.split(' ')[1]} font-bold mt-0.5">${type==='error'?'✕':'✓'}</div><div><div class="font-bold text-sm">${title}</div><div class="text-xs text-gray-400 mt-1">${msg}</div></div>`;
            c.appendChild(el);
            setTimeout(() => { el.classList.remove('animate-slide-in'); el.classList.add('animate-fade-out'); setTimeout(() => el.remove(), 300); }, 4000);
        }

        function setTab(t) {
            ['borrow','lend','portfolio'].forEach(x => {
                document.getElementById(`view-${x}`).classList.add('hidden');
                document.getElementById(`tab-${x}`).classList.replace('tab-active','tab-inactive');
                document.getElementById(`tab-${x}`).classList.remove('border-indigo-500');
            });
            document.getElementById(`view-${t}`).classList.remove('hidden');
            document.getElementById(`tab-${t}`).classList.replace('tab-inactive','tab-active');
            document.getElementById(`tab-${t}`).classList.add('border-indigo-500');
        }

        async function connectWallet() {
            if (!window.ethereum) return showToast("Error", "No Wallet Found", "error");
            try {
                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                userAddress = await signer.getAddress();
                contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
                
                document.getElementById("connectBtn").innerText = userAddress.slice(0,6) + "...";
                showToast("Connected", "Wallet active");
                loadData();
            } catch (e) { showToast("Error", e.message, "error"); }
        }

        async function toggleScan() {
            const sel = document.getElementById("scanSelect");
            const inp = document.getElementById("tokenId");
            if(sel.classList.contains("hidden")) {
                sel.classList.remove("hidden"); inp.classList.add("hidden");
                try {
                    const r = await fetch(`${RENDER_API}/portfolio?user=${userAddress}`);
                    const d = await r.json();
                    sel.innerHTML = '<option value="">-- Select Asset --</option>';
                    d.forEach(x => {
                        let opt = document.createElement("option");
                        opt.value = x.asset; opt.text = `${x.title} (${Number(x.size).toFixed(1)})`;
                        opt.setAttribute('data-price', x.livePrice);
                        sel.appendChild(opt);
                    });
                } catch(e) { showToast("Scan Error", "Could not fetch portfolio", "error"); }
            } else { sel.classList.add("hidden"); inp.classList.remove("hidden"); }
        }

        function autoFill() {
            const sel = document.getElementById("scanSelect");
            if(sel.value) document.getElementById("tokenId").value = sel.value;
            checkLTV();
        }

        function checkLTV() {
            const s = Number(document.getElementById("shares").value);
            const p = Number(document.getElementById("principal").value);
            const sel = document.getElementById("scanSelect");
            const div = document.getElementById("ltv-indicator");
            
            if(!sel.classList.contains("hidden") && sel.selectedIndex > 0) {
                const price = Number(sel.options[sel.selectedIndex].getAttribute('data-price')) || 0.5;
                const max = (s * price) * 0.5; 
                if(p > max) div.innerHTML = `<span class="text-red-500">High Risk: >50% LTV (Max rec: $${max.toFixed(2)})</span>`;
                else div.innerHTML = `<span class="text-green-500">Safe LTV (<50%)</span>`;
            }
        }

        async function getInfo(id) {
            if(CACHE_INFO[id]) return CACHE_INFO[id];
            try {
                const r = await fetch(`${RENDER_API}/market-info?tokenId=${id}`);
                const d = await r.json();
                CACHE_INFO[id] = d; return d;
            } catch { return { title: "Unknown Market", slug: "" }; }
        }

        async function createRequest() {
            if(!contract) return showToast("Wallet", "Connect first", "info");
            const id = document.getElementById("tokenId").value;
            const s = document.getElementById("shares").value;
            const p = document.getElementById("principal").value;
            const d = document.getElementById("duration").value;

            try {
                const poly = new ethers.Contract(POLY_ADDRESS, TOKEN_ABI, signer);
                if(!(await poly.isApprovedForAll(userAddress, CONTRACT_ADDRESS))) {
                    showToast("Approval", "Please approve collateral transfer", "info");
                    await(await poly.setApprovalForAll(CONTRACT_ADDRESS, true)).wait();
                }
                
                showToast("Signing", "Create Request...", "info");
                const tx = await contract.createRequest(id, ethers.parseUnits(s,0), ethers.parseUnits(p,6), BigInt(d)*86400n);
                await tx.wait();
                showToast("Success", "Request Created!", "success");
                loadData();
            } catch(e) { showToast("Error", e.message.slice(0,50), "error"); }
        }

        async function loadData() {
            if(!contract) return;
            const nextId = Number(await contract.nextRequestId());
            const nextOff = Number(await contract.nextOfferId());
            
            let offers = [];
            for(let i=1; i<nextOff; i++) {
                try { offers.push({id:i, ...await contract.offers(i)}); } catch{}
            }

            let myReqHtml = "", marketHtml = "", portHtml = "";

            for(let i=nextId-1; i>=1; i--) {
                try {
                    const req = await contract.requests(i);
                    if(req[1] == 0n) continue; 
                    
                    const info = await getInfo(req[1]);
                    const princ = ethers.formatUnits(req[3], 6);
                    const shares = req[2];
                    const durDays = Number(req[4])/86400;
                    
                    let extData = null;
                    try { const e = await contract.extensions(i); if(e[0]) extData = e; } catch{}

                    if(req[0].toLowerCase() === userAddress.toLowerCase()) {
                        let status = "PENDING";
                        let action = `<button onclick="cancelReq(${i})" class="text-xs text-red-500 border border-red-900 px-2 py-1 rounded">Cancel</button>`;
                        
                        if(req[5] && !req[6]) { // Active Request
                            const myOffers = offers.filter(o => o[0] == i && o[3]);
                            if(myOffers.length > 0) {
                                action = myOffers.map(o => `<button onclick="acceptOff(${o.id})" class="bg-green-600 text-xs px-2 py-1 rounded text-white mr-2">Accept ${Number(o[2])}% APR</button>`).join('');
                            }
                        } else if(req[5] && req[6]) { // Active Loan
                            const loan = await contract.loans(i);
                            status = "ACTIVE LOAN";
                            action = `<button onclick="repay(${i}, ${princ}, ${loan[2]}, ${Number(loan[3])})" class="bg-indigo-600 text-white text-xs px-3 py-1 rounded">Repay</button>`;
                            
                            const end = Number(loan[1]) + Number(loan[3]);
                            const now = Math.floor(Date.now()/1000);
                            if(now > end && !extData) action += ` <button onclick="reqExt(${i})" class="ml-2 border border-blue-500 text-blue-500 text-xs px-2 py-1 rounded">Extend</button>`;
                        } else if(!req[5]) status = "CLOSED";

                        myReqHtml += `
                        <div class="glass-panel p-5 rounded-xl border border-gray-800">
                            <div class="flex justify-between">
                                <div class="font-bold text-white text-sm">#${i} ${info.title}</div>
                                <div class="text-[10px] bg-gray-900 px-2 py-1 rounded text-gray-400">${status}</div>
                            </div>
                            <div class="text-xs text-gray-500 mt-2">${shares} Shares for $${princ} • ${durDays} Days</div>
                            <div class="mt-4 flex flex-wrap gap-2">${action}</div>
                        </div>`;
                    } else {
                        // MARKET FEED (LENDER VIEW)
                        if(req[5] && !req[6]) {
                            marketHtml += `
                            <div class="glass-panel p-5 rounded-xl border border-gray-800 hover:border-indigo-500/50 transition">
                                <div class="font-bold text-white text-sm mb-2">#${i} ${info.title}</div>
                                <div class="flex justify-between text-xs text-gray-500 mb-4">
                                    <span>Ask: $${princ}</span><span>${durDays} Days</span>
                                </div>
                                <div class="flex gap-2">
                                    <input id="apr_${i}" placeholder="APR%" class="w-16 bg-black border border-gray-700 rounded text-center text-xs text-white">
                                    <button onclick="makeOffer(${i}, ${princ})" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded py-2">Offer Loan</button>
                                </div>
                            </div>`;
                        } else if(req[6] && req[5]) { // ACTIVE LOAN (Check for Buyout)
                            const loan = await contract.loans(i);
                            if(loan[0].toLowerCase() === userAddress.toLowerCase()) {
                                // I am the lender
                                portHtml += `<div class="glass-panel p-4 rounded-xl border border-emerald-900/30"><div class="text-sm font-bold text-white">Loan #${i} - ${info.title}</div><div class="text-xs text-emerald-500 mt-1">Active Investment ($${princ})</div></div>`;
                            }
                            
                            // Check Buyout
                            if(extData && extData[3]) { // isRejected = true
                                const now = Math.floor(Date.now()/1000);
                                if(now < Number(extData[4]) + 86400) {
                                    marketHtml += `
                                    <div class="glass-panel p-5 rounded-xl border border-yellow-500 bg-yellow-900/10">
                                        <div class="font-bold text-yellow-500 text-sm mb-1">🔥 HOSTILE BUYOUT #${i}</div>
                                        <div class="text-xs text-white mb-3">${info.title}</div>
                                        <button onclick="buyout(${i}, ${princ})" class="w-full bg-yellow-600 text-black font-bold text-xs py-2 rounded">Buy Debt ($${princ})</button>
                                    </div>`;
                                }
                            }
                        }
                    }
                } catch(e) { console.log(e); }
            }
            
            document.getElementById("my-requests-feed").innerHTML = myReqHtml || '<div class="text-center text-gray-600 py-4">No requests</div>';
            document.getElementById("market-feed").innerHTML = marketHtml || '<div class="text-center text-gray-600 py-4 col-span-3">No active opportunities</div>';
            document.getElementById("my-investments").innerHTML = portHtml || '<div class="text-center text-gray-600 py-4">No investments</div>';
        }

        // --- ACTIONS ---
        async function makeOffer(id, p) {
            const r = document.getElementById(`apr_${id}`).value;
            if(!r) return showToast("Error", "Enter APR", "error");
            try {
                const u = new ethers.Contract(USDC_ADDRESS, TOKEN_ABI, signer);
                const amt = ethers.parseUnits(p, 6);
                if((await u.allowance(userAddress, CONTRACT_ADDRESS)) < amt) {
                    showToast("Approve", "Approving USDC...", "info");
                    await(await u.approve(CONTRACT_ADDRESS, ethers.MaxUint256)).wait();
                }
                const tx = await contract.makeOffer(id, BigInt(r));
                await tx.wait(); showToast("Sent", "Offer Placed!");
            } catch(e) { showToast("Error", e.message, "error"); }
        }

        async function acceptOff(oid) {
            try { await(await contract.acceptOffer(oid)).wait(); showToast("Success", "Loan Started!"); loadData(); } catch(e){ showToast("Error", e.message, "error"); }
        }

        async function repay(id, p, r, d) {
            try {
                const interest = (Number(p)*Number(r)*Number(d)) / (31536000 * 100);
                const total = Number(p) + interest;
                const u = new ethers.Contract(USDC_ADDRESS, TOKEN_ABI, signer);
                const amt = ethers.parseUnits((total*1.01).toFixed(6), 6);
                if((await u.allowance(userAddress, CONTRACT_ADDRESS)) < amt) {
                    await(await u.approve(CONTRACT_ADDRESS, ethers.MaxUint256)).wait();
                }
                await(await contract.repayLoan(id)).wait(); showToast("Success", "Loan Repaid!"); loadData();
            } catch(e){ showToast("Error", e.message, "error"); }
        }

        async function reqExt(id) {
            const d = prompt("Days to extend:");
            if(d) { await(await contract.requestExtension(id, BigInt(d))).wait(); showToast("Sent", "Extension Requested"); }
        }

        async function buyout(id, p) {
            try {
                const u = new ethers.Contract(USDC_ADDRESS, TOKEN_ABI, signer);
                const amt = ethers.parseUnits(p, 6);
                if((await u.allowance(userAddress, CONTRACT_ADDRESS)) < amt) await(await u.approve(CONTRACT_ADDRESS, ethers.MaxUint256)).wait();
                await(await contract.buyoutLoan(id)).wait(); showToast("Success", "Loan Bought!"); loadData();
            } catch(e){ showToast("Error", e.message, "error"); }
        }

        async function cancelReq(id) {
            if(confirm("Cancel Request?")) { await(await contract.cancelRequest(id)).wait(); loadData(); }
        }
    </script>
</body>
</html>
