<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>PolyLoans | Debug Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>body{background:#000;color:#0f0;font-family:'JetBrains Mono',monospace;padding:20px}</style>
</head>
<body>
    <h1 class="text-xl font-bold mb-4">🚀 DIAGNOSTIC TERMINAL</h1>
    
    <div class="mb-6 border p-4 border-green-800">
        <div>1. Wallet: <span id="walletAddr" class="text-white">...</span></div>
        <div>2. Proxy (Server): <span id="proxyAddr" class="text-white">Loading...</span></div>
        <div>3. Contract: <span class="text-blue-400">0x3067...33E4</span></div>
        <button onclick="connect()" class="bg-green-700 text-black px-4 py-1 font-bold mt-2">CONNECT WALLET</button>
    </div>

    <h2 class="text-lg font-bold mt-8 border-b border-gray-700">RAW CONTRACT DATA (All Requests)</h2>
    <div id="debugLog" class="mt-4 space-y-2 text-xs text-gray-400">Waiting for connection...</div>

    <script>
    const MARKET_ADDR = "0x30672b8B427BD7277c8467221441e2D3Dbf833E4"; 
    const MARKET_ABI = ["function nextRequestId() view returns (uint256)","function requests(uint256) view returns (address, uint256, uint256, uint256, uint256, bool, bool)"];
    const RENDER_API_URL = "https://polyloans-api.onrender.com";

    let signer, userAddress;

    async function connect() {
        if(!window.ethereum) return alert("No Wallet");
        const provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = await provider.getSigner();
        userAddress = await signer.getAddress();
        
        document.getElementById("walletAddr").innerText = userAddress;
        
        // 1. Check Proxy
        checkProxy();
        // 2. Scan Contract
        scanContract();
    }

    async function checkProxy() {
        try {
            const r = await fetch(`${RENDER_API_URL}/get-nonce?user=${userAddress}`);
            const d = await r.json();
            document.getElementById("proxyAddr").innerText = d.proxy || "NOT FOUND IN SERVER MAP";
            document.getElementById("proxyAddr").className = d.proxy ? "text-green-400" : "text-red-500 font-bold";
        } catch(e) { document.getElementById("proxyAddr").innerText = "API ERROR"; }
    }

    async function scanContract() {
        const log = document.getElementById("debugLog");
        log.innerHTML = "Scanning Blockchain...";
        
        const contract = new ethers.Contract(MARKET_ADDR, MARKET_ABI, signer);
        const nextId = await contract.nextRequestId();
        
        log.innerHTML = `Total Requests in Contract: ${Number(nextId)-1}<br><br>`;

        if(Number(nextId) === 1) {
            log.innerHTML += "<span class='text-red-500'>⚠️ NO REQUESTS FOUND ON CHAIN. The transaction might have failed or reverted.</span>";
            return;
        }

        for(let i=1; i<Number(nextId); i++) {
            const req = await contract.requests(i);
            // req = [borrower, tokenId, shares, principal, duration, isActive, isLoan]
            
            const borrower = req[0];
            const isActive = req[5];
            const isLoan = req[6];
            
            let status = "UNKNOWN";
            if(isActive && !isLoan) status = "PENDING (Waiting for Offer)";
            if(isActive && isLoan) status = "ACTIVE LOAN";
            if(!isActive) status = "CANCELLED / REPAID";

            const isMe = (borrower.toLowerCase() === userAddress.toLowerCase());
            const isMyProxy = (document.getElementById("proxyAddr").innerText.toLowerCase() === borrower.toLowerCase());

            let ownership = "❌ OTHER USER";
            if(isMe) ownership = "✅ MY WALLET";
            if(isMyProxy) ownership = "✅ MY PROXY";

            log.innerHTML += `
            <div class="border border-gray-800 p-2 mb-2">
                <div class="font-bold text-white">Request #${i}</div>
                <div>Borrower: ${borrower} <span class="font-bold ml-2">${ownership}</span></div>
                <div>Status: <span class="text-yellow-400">${status}</span></div>
                <div>Shares Locked: ${ethers.formatUnits(req[2], 6)}</div>
            </div>`;
        }
    }
    </script>
</body>
</html>
