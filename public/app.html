<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>PolyLoans</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"']},colors:{bg:'#020408',surface:'#0B0D12',border:'#1E2129',brand:'#6366F1'}}}}; </script>
    <style>body{background:#020408;color:#E2E8F0}.hidden-tab{display:none!important}.btn-primary{background:#6366F1;color:white;transition:0.2s}.btn-primary:hover{background:#4F46E5}</style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="h-20 border-b border-[#1E2129] flex items-center justify-between px-8 bg-[#020408]/90 backdrop-blur fixed w-full z-50">
        <div class="flex items-center gap-8"><span class="font-bold text-lg text-white">PolyLoans</span>
            <div class="hidden flex gap-4 text-sm font-medium h-20 items-center">
                <button onclick="switchTab('borrow')" id="tab-borrow" class="text-white border-b-2 border-brand h-full">Borrow</button>
                <button onclick="switchTab('lend')" id="tab-lend" class="text-gray-500 h-full">Lend</button>
            </div>
        </div>
        <button id="btnConnect" onclick="connectWallet()" class="btn-primary px-4 py-2 rounded text-sm font-bold shadow-lg">Connect Wallet</button>
        <div id="userAddr" class="hidden font-mono text-xs text-gray-400"></div>
    </nav>

    <main class="pt-28 p-8 max-w-7xl mx-auto w-full space-y-8">

        <!-- BORROW -->
        <div id="view-borrow" class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-4 bg-[#0B0D12] border border-[#1E2129] rounded-xl p-6 space-y-5 h-fit">
                <h2 class="font-bold text-white">New Request</h2>
                <div><label class="text-xs font-bold text-gray-500">Asset</label>
                    <div class="flex justify-between mb-1"><label class="text-[10px] text-brand cursor-pointer"><input type="checkbox" onchange="toggleManual(this)"> Manual Input</label></div>
                    <select id="positionSelect" onchange="autoFillForm()" class="w-full bg-[#050608] border border-[#1E2129] rounded px-3 py-2 text-sm text-white"><option value="">Scanning...</option></select>
                    <input type="text" id="manualId" placeholder="Token ID" class="hidden w-full bg-[#050608] border border-[#1E2129] rounded px-3 py-2 text-sm text-white text-[10px]" oninput="document.getElementById('b_tokenId').value=this.value">
                    <div id="balanceDisplay" class="text-xs text-brand mt-1 h-4"></div>
                </div>
                <input type="text" id="b_tokenId" class="hidden">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-xs text-gray-500">Shares</label><input type="number" id="b_shares" class="w-full bg-[#050608] border border-[#1E2129] rounded px-3 py-2 text-sm text-white"></div>
                    <div><label class="text-xs text-gray-500">USDC</label><input type="number" id="b_principal" class="w-full bg-[#050608] border border-[#1E2129] rounded px-3 py-2 text-sm text-white"></div>
                </div>
                <div><label class="text-xs text-gray-500">Duration (Mins)</label><input type="number" id="b_duration" class="w-full bg-[#050608] border border-[#1E2129] rounded px-3 py-2 text-sm text-white" placeholder="60"></div>
                <button onclick="handleCreateRequest()" id="btnCreate" disabled class="w-full btn-primary py-3 rounded font-bold text-sm disabled:opacity-50">Sign & Post</button>
                <div id="b_status" class="text-center text-xs mt-2 text-gray-500"></div>
            </div>
            <div class="lg:col-span-8 space-y-6">
                <div class="bg-[#0B0D12] border border-[#1E2129] rounded-xl p-6"><h3 class="font-bold text-white mb-4">My Debts</h3><div id="borrowerLoans" class="space-y-3 text-sm text-gray-500">None</div></div>
                <div class="bg-[#0B0D12] border border-[#1E2129] rounded-xl p-6"><h3 class="font-bold text-white mb-4">Incoming Offers</h3><div id="borrowerOffers" class="space-y-3 text-sm text-gray-500">None</div></div>
            </div>
        </div>

        <!-- LEND -->
        <div id="view-lend" class="hidden-tab space-y-6">
            <div class="bg-[#0B0D12] border border-[#1E2129] rounded-xl p-6">
                <div class="flex justify-between items-center mb-4"><h2 class="font-bold text-white">Market Feed</h2><button onclick="loadData()" class="text-xs text-brand">Refresh</button></div>
                <div id="marketFeed" class="space-y-3 text-gray-500 text-sm">Loading...</div>
            </div>
            <div class="bg-[#0B0D12] border border-[#1E2129] rounded-xl p-6"><h2 class="font-bold text-white mb-4">Investments</h2><div id="lenderLoans" class="space-y-3 text-gray-500">None</div></div>
        </div>
    </main>

    <script>
    const MARKET_ADDR = "0x30672b8B427BD7277c8467221441e2D3Dbf833E4"; 
    const USDC_ADDR = "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359"; 
    const RENDER_API_URL = "https://polyloans-api.onrender.com"; 
    let signer, userAddress, marketContract, myProxy;
    const INFO_CACHE = {}; 
    const MARKET_ABI = ["function createRequest(uint256,uint256,uint256,uint256) external returns (uint256)","function makeOffer(uint256,uint256,uint256) external returns (uint256)","function acceptOffer(uint256) external","function repayLoan(uint256) external","function cancelRequest(uint256) external","function requests(uint256) view returns (address, uint256, uint256, uint256, uint256, bool, bool)","function loans(uint256) view returns (address, uint256, uint256, uint256)","function offers(uint256) view returns (uint256, address, uint256, bool)","function nextRequestId() view returns (uint256)","function nextOfferId() view returns (uint256)"];
    const USDC_ABI = ["function approve(address, uint256) external"];

    async function connectWallet() {
        if(!window.ethereum) return alert("Install Wallet");
        const provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = await provider.getSigner();
        userAddress = await signer.getAddress();
        marketContract = new ethers.Contract(MARKET_ADDR, MARKET_ABI, signer);
        document.getElementById("btnConnect").innerText = userAddress.slice(0,6)+"...";
        document.getElementById("userAddr").innerText = userAddress;
        document.getElementById("userAddr").classList.remove("hidden");
        document.getElementById("btnConnect").style.display = "none";
        
        switchTab('borrow');
        await initProxy();
        scanPortfolio(); loadData(); setInterval(loadData, 3000);
    }

    function isMe(addr) { return addr && (addr.toLowerCase() === userAddress.toLowerCase() || (myProxy && addr.toLowerCase() === myProxy)); }
    function switchTab(t) { ['borrow','lend'].forEach(v => { document.getElementById(`view-${v}`).classList.add('hidden-tab'); document.getElementById(`tab-${v}`).classList.remove('border-brand','text-white'); document.getElementById(`tab-${v}`).classList.add('text-gray-500'); }); document.getElementById(`view-${t}`).classList.remove('hidden-tab'); document.getElementById(`tab-${t}`).classList.add('border-brand','text-white'); }

    async function loadData() {
        const nextId = await marketContract.nextRequestId();
        let feed="", bLoans="";
        for(let i=1; i<Number(nextId); i++) {
            try {
                const req = await marketContract.requests(i);
                if (req[1].toString() === "0") continue; // HIDE ID 0
                if(req[5] && !req[6]) { // Pending
                    const info = await getInfo(req[1]);
                    if(isMe(req[0])) bLoans += `<div class="p-4 border border-gray-700 rounded bg-[#050608] flex justify-between"><div><div class="font-bold text-white text-sm">${info.title}</div><div class="text-[10px] text-gray-500">ID: ${req[1].toString().slice(0,6)}...</div></div><button onclick="cancel(${i})" class="text-red-400 text-xs border border-red-900 px-3 py-1 rounded">Cancel</button></div>`;
                    else feed += `<div class="p-4 border border-[#1E2129] rounded bg-[#050608] flex justify-between items-center"><div><div class="font-bold text-white text-sm">${info.title}</div><div class="text-xs text-gray-500">Ask: $${ethers.formatUnits(req[3],6)}</div></div><div class="flex gap-2"><input id="r_${i}" placeholder="%" class="w-10 bg-black text-white text-center text-xs rounded border border-gray-700"><button onclick="makeOffer(${i})" class="bg-brand px-3 py-1 rounded text-xs text-white">Offer</button></div></div>`;
                }
            } catch(e){}
        }
        document.getElementById("marketFeed").innerHTML = feed || "No requests.";
        document.getElementById("borrowerLoans").innerHTML = bLoans || "No debts.";
    }

    async function initProxy() { try{ const r=await fetch(`${RENDER_API_URL}/get-nonce?user=${userAddress}`); const d=await r.json(); window.myProxy=d.proxy ? d.proxy.toLowerCase() : null; }catch(e){} }
    async function getInfo(id) { if(INFO_CACHE[id]) return INFO_CACHE[id]; try { const res = await fetch(`${RENDER_API_URL}/market-info?tokenId=${id}`); const d = await res.json(); INFO_CACHE[id]=d; return d; } catch{ return {title:"Unknown"}; } }
    async function scanPortfolio() {
        const select = document.getElementById("positionSelect");
        try {
            const res = await fetch(`${RENDER_API_URL}/portfolio?user=${userAddress}`);
            const data = await res.json();
            if (data.length === 0) { select.innerHTML = '<option value="">No assets found</option>'; return; }
            select.innerHTML = '<option value="">-- Select Asset --</option>';
            data.forEach(p => {
                const opt = document.createElement("option");
                opt.value = p.asset; opt.setAttribute("data-bal", p.size); opt.setAttribute("data-price", p.livePrice);
                opt.text = `${p.title} (${Number(p.size).toFixed(2)})`;
                select.appendChild(opt);
            });
        } catch(e) { select.innerHTML = '<option>Error</option>'; }
    }
    
    function toggleManual(cb) { document.getElementById("positionSelect").style.display = cb.checked?"none":"block"; document.getElementById("manualId").style.display = cb.checked?"block":"none"; }
    function autoFillForm() { const sel = document.getElementById("positionSelect"); if(sel.value) { const opt = sel.selectedOptions[0]; document.getElementById("b_tokenId").value = opt.value; document.getElementById("balanceDisplay").innerText = `Bal: ${opt.getAttribute("data-bal")} | $${Number(opt.getAttribute("data-price")).toFixed(2)}`; checkLTV(); } }
    function checkLTV() { document.getElementById("btnCreate").disabled = false; }
    
    async function signAndRelay(func, args) {
        try {
            const nonceRes = await fetch(`${RENDER_API_URL}/get-nonce?user=${userAddress}`);
            const meta = await nonceRes.json();
            if(!meta.proxy) return alert("No Proxy Found");
            const iface = new ethers.Interface(MARKET_ABI);
            const data = iface.encodeFunctionData(func, args);
            const domain = { verifyingContract: meta.proxy, chainId: 137 };
            const types = { SafeTx: [{type:"address",name:"to"},{type:"uint256",name:"value"},{type:"bytes",name:"data"},{type:"uint8",name:"operation"},{type:"uint256",name:"safeTxGas"},{type:"uint256",name:"baseGas"},{type:"uint256",name:"gasPrice"},{type:"address",name:"gasToken"},{type:"address",name:"refundReceiver"},{type:"uint256",name:"nonce"}] };
            const message = { to: MARKET_ADDR, value: 0, data, operation: 0, safeTxGas: 0, baseGas: 0, gasPrice: 0, gasToken: "0x0000000000000000000000000000000000000000", refundReceiver: "0x0000000000000000000000000000000000000000", nonce: meta.nonce };
            const sig = await signer.signTypedData(domain, types, message);
            const res = await fetch(`${RENDER_API_URL}/relay-tx`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ proxy: meta.proxy, to: MARKET_ADDR, data, signature: sig }) });
            const json = await res.json();
            if(!json.success) throw new Error(json.error);
            return json.txHash;
        } catch(e) { alert("Error: " + e.message); return null; }
    }

    async function handleCreateRequest() {
        let id = document.getElementById("manualTokenId").value || document.getElementById("positionSelect").value;
        const s = document.getElementById("b_shares").value;
        const p = document.getElementById("b_principal").value;
        const d = document.getElementById("b_duration").value;
        if(!id || id == "0") return alert("Invalid ID");
        document.getElementById("b_status").innerText = "Signing...";
        const tx = await signAndRelay('createRequest', [id, BigInt(Math.floor(s*1e6)), BigInt(Math.floor(p*1e6)), BigInt(d*60)]);
        if(tx) { document.getElementById("b_status").innerText = "Success!"; setTimeout(loadData, 2000); }
    }

    async function makeOffer(id) { const r = document.getElementById("rate_"+id).value; const u = new ethers.Contract(USDC_ADDR, USDC_ABI, signer); await(await u.approve(MARKET_ADDR,ethers.MaxUint256)).wait(); await(await marketContract.makeOffer(id, Number(r))).wait(); alert("Sent!"); loadData(); }
    async function cancel(id) { if(confirm("Cancel?")) await signAndRelay("cancelRequest", [id]); }
    </script>
</body>
</html>
