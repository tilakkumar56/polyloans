<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyLoans</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"'],mono:['"JetBrains Mono"']},colors:{bg:'#020408',surface:'#0B0D12',border:'#1E2129',brand:'#6366F1'}}}}; </script>
    <style>
        body{background:#020408;color:#E2E8F0}
        .panel{background:#0B0D12;border:1px solid #1E2129}
        .input-prem{background:#050608;border:1px solid #1E2129;color:#FFF}
        .hidden-tab{display:none !important} 
        /* !important ensures it definitely hides */
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="h-16 border-b border-[#1E2129] flex items-center justify-between px-6 bg-[#020408]">
        <div class="flex items-center gap-8">
            <span class="font-bold text-lg text-white">PolyLoans</span>
            <div id="navTabs" class="hidden flex gap-4 text-sm font-medium">
                <button onclick="switchTab('overview')" id="btn-overview" class="text-white border-b-2 border-brand">Overview</button>
                <button onclick="switchTab('borrow')" id="btn-borrow" class="text-gray-500">Borrow</button>
                <button onclick="switchTab('lend')" id="btn-lend" class="text-gray-500">Lend</button>
            </div>
        </div>
        <button id="btnConnect" onclick="connectWallet()" class="bg-[#6366F1] px-4 py-2 rounded text-sm font-bold text-white">Connect Wallet</button>
        <div id="userAddr" class="hidden font-mono text-xs text-gray-400 border border-gray-800 px-3 py-1 rounded bg-[#0B0D12]"></div>
    </nav>

    <main class="p-6 max-w-7xl mx-auto w-full">
        
        <div id="view-overview" class="space-y-6">
            <h2 class="text-xl font-bold">Dashboard</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="panel p-6 rounded-xl">
                    <div class="text-gray-500 text-xs uppercase">Total Borrowed</div>
                    <div class="text-2xl font-bold text-red-400" id="statBorrowed">$0.00</div>
                </div>
                <div class="panel p-6 rounded-xl">
                    <div class="text-gray-500 text-xs uppercase">Total Lent</div>
                    <div class="text-2xl font-bold text-emerald-400" id="statLent">$0.00</div>
                </div>
                <div class="panel p-6 rounded-xl">
                    <div class="text-gray-500 text-xs uppercase">Active Deals</div>
                    <div class="text-2xl font-bold text-white" id="statCount">0</div>
                </div>
            </div>
            
            <div class="panel p-6 rounded-xl">
                <h3 class="font-bold mb-4">Recent Activity</h3>
                <div id="activityLog" class="text-sm text-gray-500">No recent activity.</div>
            </div>
        </div>

        <div id="view-borrow" class="hidden-tab grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-4 panel rounded-xl p-6 space-y-4 h-fit">
                <h2 class="font-bold border-b border-gray-800 pb-2">New Loan Request</h2>
                
                <div>
                    <label class="text-xs text-gray-500 block mb-1">Select Asset</label>
                    <select id="positionSelect" onchange="autoFillForm()" class="input-prem w-full rounded p-2 text-sm"></select>
                    <div id="priceDisplay" class="text-xs h-4 mt-1 text-gray-400 font-mono"></div>
                </div>

                <input type="text" id="b_tokenId" class="hidden">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">Shares to Lock</label>
                        <input type="number" id="b_shares" class="input-prem w-full rounded p-2 text-sm" oninput="checkLTV()">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">USDC Wanted</label>
                        <input type="number" id="b_principal" class="input-prem w-full rounded p-2 text-sm" oninput="checkLTV()">
                    </div>
                </div>
                
                <div id="ltvWarning" class="text-xs text-right h-4 font-mono"></div>
                
                <div>
                    <label class="text-xs text-gray-500 block mb-1">Duration (Minutes)</label>
                    <input type="number" id="b_duration" class="input-prem w-full rounded p-2 text-sm" placeholder="e.g. 60">
                </div>

                <button onclick="handleCreateRequest()" id="btnPost" class="w-full bg-[#6366F1] hover:bg-[#565add] py-3 rounded font-bold text-sm text-white transition">Sign & Post</button>
                <div id="postStatus" class="text-center text-xs text-gray-500 mt-2"></div>
            </div>

            <div class="lg:col-span-8 space-y-6">
                <div class="panel rounded-xl p-6">
                    <h2 class="font-bold mb-4 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-green-500"></span> Incoming Offers</h2>
                    <div id="borrowerOffers" class="space-y-2"></div>
                </div>
                <div class="panel rounded-xl p-6">
                    <h2 class="font-bold mb-4 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-red-500"></span> My Active Debts</h2>
                    <div id="borrowerLoans" class="space-y-2"></div>
                </div>
            </div>
        </div>

        <div id="view-lend" class="hidden-tab space-y-6">
            <div class="panel rounded-xl overflow-hidden p-4">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span> Live Market Feed</h2>
                    <button onclick="loadData()" class="text-xs text-brand hover:text-white">Refresh</button>
                </div>
                <div id="marketFeed" class="space-y-2">
                    <div class="text-center text-gray-600 py-8">Loading market data...</div>
                </div>
            </div>
            
            <div class="panel rounded-xl p-6">
                <h2 class="font-bold mb-4">My Investments</h2>
                <div id="lenderLoans" class="space-y-2"></div>
            </div>
        </div>

    </main>

    <script>
    // ⚠️ UPDATE ADDRESS IF YOU DEPLOYED NEW CONTRACT ⚠️
    const MARKET_ADDR = "0x30672b8B427BD7277c8467221441e2D3Dbf833E4"; // Example: Replace with YOUR deployed address
    const USDC_ADDR = "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359";
    const RENDER_API_URL = "https://polyloans-api.onrender.com"; 
    
    let signer, userAddress, marketContract, myProxy;

    const MARKET_ABI = ["function createRequest(uint256,uint256,uint256,uint256) external returns (uint256)","function makeOffer(uint256,uint256,uint256) external returns (uint256)","function acceptOffer(uint256) external","function repayLoan(uint256) external","function requestExtension(uint256,uint256) external","function acceptExtension(uint256) external","function buyoutLoan(uint256) external","function liquidateByTime(uint256) external","function requests(uint256) view returns (address, uint256, uint256, uint256, uint256, bool, bool)","function loans(uint256) view returns (address, uint256, uint256, uint256)","function offers(uint256) view returns (uint256, address, uint256, bool)","function extensions(uint256) view returns (bool, uint256, uint256)","function nextRequestId() view returns (uint256)","function nextOfferId() view returns (uint256)","function cancelRequest(uint256) external"];
    const USDC_ABI = ["function approve(address, uint256) external"];

    async function connectWallet() {
        if(!window.ethereum) return alert("Install Rabby/MetaMask");
        const provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        userAddress = await signer.getAddress();
        marketContract = new ethers.Contract(MARKET_ADDR, MARKET_ABI, signer);
        
        document.getElementById("userAddr").innerText = userAddress.slice(0,6)+"..."+userAddress.slice(-4);
        document.getElementById("userAddr").classList.remove("hidden");
        document.getElementById("btnConnect").style.display = "none";
        document.getElementById("navTabs").classList.remove("hidden");
        
        // Auto-switch to Overview
        switchTab('overview');
        
        try { const r = await fetch(`${RENDER_API_URL}/get-nonce?user=${userAddress}`); const d = await r.json(); window.myProxy = d.proxy; } catch(e){}
        
        scanPortfolio(); 
        loadData(); 
        setInterval(loadData, 3000);
    }

    function switchTab(t) {
        // HIDE ALL
        document.getElementById('view-overview').classList.add('hidden-tab');
        document.getElementById('view-borrow').classList.add('hidden-tab');
        document.getElementById('view-lend').classList.add('hidden-tab');
        
        // RESET BUTTONS
        ['overview','borrow','lend'].forEach(b => {
            const btn = document.getElementById(`btn-${b}`);
            btn.classList.remove('text-white', 'border-b-2', 'border-brand');
            btn.classList.add('text-gray-500');
        });

        // SHOW SELECTED
        document.getElementById(`view-${t}`).classList.remove('hidden-tab');
        const activeBtn = document.getElementById(`btn-${t}`);
        activeBtn.classList.remove('text-gray-500');
        activeBtn.classList.add('text-white', 'border-b-2', 'border-brand');
    }

    async function scanPortfolio() {
        const res = await fetch(`${RENDER_API_URL}/portfolio?user=${userAddress}`);
        const data = await res.json();
        const sel = document.getElementById("positionSelect");
        if(data.length === 0) { sel.innerHTML = '<option>No assets found</option>'; return; }
        
        sel.innerHTML = '<option value="">-- Select Asset --</option>';
        data.forEach(p => {
            const opt = document.createElement("option");
            opt.value = p.asset; 
            opt.text = `${p.title} (${p.size})`;
            opt.setAttribute("data-bal", p.size); 
            opt.setAttribute("data-price", p.livePrice);
            sel.appendChild(opt);
        });
        document.getElementById("statShares").innerText = data.length;
    }

    function autoFillForm() {
        const opt = document.getElementById("positionSelect").selectedOptions[0];
        if(opt.value) {
            document.getElementById("b_tokenId").value = opt.value;
            const price = Number(opt.getAttribute("data-price"));
            const displayPrice = price === 0.5 ? "$0.50 (Est)" : `$${price.toFixed(2)}`;
            document.getElementById("priceDisplay").innerText = `Bal: ${opt.getAttribute("data-bal")} | Price: ${displayPrice}`;
        }
    }

    function checkLTV() {
        const shares = document.getElementById("b_shares").value;
        const principal = document.getElementById("b_principal").value;
        const opt = document.getElementById("positionSelect").selectedOptions[0];
        const price = opt ? Number(opt.getAttribute("data-price")) : 0.5;
        
        // 50% LTV Logic
        const maxBorrow = shares * price * 0.50; 
        const warn = document.getElementById("ltvWarning");
        const btn = document.getElementById("btnPost");

        if(principal > maxBorrow) {
            warn.innerHTML = `<span class="text-red-500">Max Borrow: $${maxBorrow.toFixed(2)}</span>`;
            btn.disabled = true;
            btn.classList.add("opacity-50", "cursor-not-allowed");
        } else {
            warn.innerHTML = `<span class="text-green-500">LTV OK</span>`;
            btn.disabled = false;
            btn.classList.remove("opacity-50", "cursor-not-allowed");
        }
    }

    async function signAndRelay(func, args) {
        const metaRes = await fetch(`${RENDER_API_URL}/get-nonce?user=${userAddress}`);
        const meta = await metaRes.json();
        if(!meta.proxy) return alert("No Proxy Found");

        const iface = new ethers.Interface(MARKET_ABI);
        const data = iface.encodeFunctionData(func, args);
        
        // Strict GS026 Match: safeTxGas = 0
        const domain = { verifyingContract: meta.proxy, chainId: 137 };
        const types = { SafeTx: [{type:"address",name:"to"},{type:"uint256",name:"value"},{type:"bytes",name:"data"},{type:"uint8",name:"operation"},{type:"uint256",name:"safeTxGas"},{type:"uint256",name:"baseGas"},{type:"uint256",name:"gasPrice"},{type:"address",name:"gasToken"},{type:"address",name:"refundReceiver"},{type:"uint256",name:"nonce"}] };
        const message = { to: MARKET_ADDR, value: 0, data, operation: 0, safeTxGas: 0, baseGas: 0, gasPrice: 0, gasToken: "0x0000000000000000000000000000000000000000", refundReceiver: "0x0000000000000000000000000000000000000000", nonce: meta.nonce };
        
        const sig = await signer.signTypedData(domain, types, message);
        await fetch(`${RENDER_API_URL}/relay-tx`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ proxy: meta.proxy, to: MARKET_ADDR, data, signature: sig }) });
    }

    async function handleCreateRequest() {
        const id = document.getElementById("b_tokenId").value;
        const s = document.getElementById("b_shares").value;
        const p = document.getElementById("b_principal").value;
        const d = document.getElementById("b_duration").value;
        
        document.getElementById("postStatus").innerText = "⏳ Signing...";
        try {
            await signAndRelay('createRequest', [id, BigInt(Math.floor(s*1e6)), BigInt(Math.floor(p*1e6)), BigInt(d*60)]);
            document.getElementById("postStatus").innerText = "✅ Posted! Check 'My Active Debts'";
            // Switch to see it immediately
            setTimeout(loadData, 1000);
        } catch(e) {
            document.getElementById("postStatus").innerText = "❌ Failed";
            console.error(e);
        }
    }

    async function loadData() {
        const nextId = await marketContract.nextRequestId();
        const nextOff = await marketContract.nextOfferId();
        
        let feed="", bOffers="", bLoans="", lLoans="", borrowed=0, lent=0, count=0;
        const myProxyLower = window.myProxy?.toLowerCase();

        for(let i=1; i<Number(nextId); i++) {
            try {
                const req = await marketContract.requests(i);
                const loan = await marketContract.loans(i);
                
                // Only fetch info if we display it (optimization)
                let info;
                if(req[5] || req[6]) {
                    info = await (await fetch(`${RENDER_API_URL}/market-info?tokenId=${req[1]}`)).json();
                }

                // --- 1. MARKET FEED (Lend Tab) ---
                if(req[5] && !req[6]) { // Active, Not yet a loan
                    const isMine = (req[0].toLowerCase() === myProxyLower);
                    
                    // Show EVERYTHING, but disable your own
                    let actionBtn = isMine 
                        ? `<span class="text-xs border border-gray-700 text-gray-400 px-2 py-1 rounded select-none">Your Request</span>` 
                        : `<div class="flex gap-2"><input id="rate_${i}" placeholder="%" class="w-12 bg-black border border-gray-700 text-xs p-1 rounded text-center"><button onclick="makeOffer(${i})" class="bg-brand hover:bg-indigo-500 px-3 py-1 text-xs rounded text-white transition">Offer Loan</button></div>`;

                    feed += `
                    <div class="p-4 border border-[#1E2129] rounded-xl bg-[#0B0D12] flex justify-between items-center hover:border-gray-700 transition">
                        <div>
                            <div class="font-bold text-sm text-white mb-1">${info.title}</div>
                            <div class="text-xs text-gray-500 font-mono mb-1">
                                Collateral: ${ethers.formatUnits(req[2],6)} Shares <span class="text-gray-700">|</span> Ask: <span class="text-white">$${ethers.formatUnits(req[3],6)}</span>
                            </div>
                            <div class="flex gap-3">
                                <a href="https://polymarket.com/event/${info.slug}" target="_blank" class="text-[10px] text-brand hover:underline">View Market ↗</a>
                                <span class="text-[10px] text-gray-600 font-mono">User: ${req[0].slice(0,6)}...</span>
                            </div>
                        </div>
                        <div>${actionBtn}</div>
                    </div>`;
                }

                // --- 2. ACTIVE LOANS (Borrower Side & Lender Side) ---
                if(req[6]) { // It IS a loan
                    const ext = await marketContract.extensions(i);
                    const end = Number(loan[1]) + Number(loan[3]);
                    const timeLeft = end - Math.floor(Date.now()/1000);
                    const isExpired = timeLeft <= 0;

                    // I am the BORROWER
                    if(req[0].toLowerCase() === myProxyLower) {
                        borrowed += Number(ethers.formatUnits(req[3],6));
                        count++;
                        let status = isExpired ? `<span class="text-red-500 font-bold">EXPIRED</span>` : `<span class="text-emerald-400 font-mono">${(timeLeft/60).toFixed(0)}m left</span>`;
                        let extBtn = ext[0] ? `<span class="text-yellow-500 text-[10px]">Ext Pending</span>` : `<button onclick="reqExt(${i})" class="text-[10px] text-blue-500 underline">Extend</button>`;

                        bLoans += `
                        <div class="p-4 border border-[#1E2129] rounded-xl bg-[#0B0D12]">
                            <div class="flex justify-between mb-2">
                                <span class="font-bold text-white text-sm truncate w-3/4">${info.title}</span>
                                ${status}
                            </div>
                            <div class="text-xs text-gray-500 mb-3">Lender: ${loan[0].slice(0,6)}...</div>
                            <div class="flex gap-2">
                                <button onclick="repay(${i})" class="flex-1 bg-green-600 hover:bg-green-500 py-2 rounded text-xs font-bold text-white">Repay Loan</button>
                                <div class="flex items-center">${extBtn}</div>
                            </div>
                        </div>`;
                    }

                    // I am the LENDER
                    if(loan[0].toLowerCase() === userAddress.toLowerCase()) {
                        lent += Number(ethers.formatUnits(req[3],6));
                        count++;
                        
                        let action = "";
                        if(isExpired) action = `<button onclick="liquidate(${i})" class="w-full bg-red-600 hover:bg-red-500 text-white text-xs py-2 rounded mt-2 font-bold">Seize Collateral</button>`;
                        else if(ext[0]) action = `<button onclick="acceptExt(${i})" class="w-full bg-blue-600 text-white text-xs py-2 rounded mt-2">Accept Extension (${(Number(ext[1])/60).toFixed(0)}m)</button>`;
                        else action = `<div class="text-center text-[10px] text-gray-600 mt-2 italic">Loan in progress...</div>`;

                        lLoans += `
                        <div class="p-4 border border-[#1E2129] rounded-xl bg-[#0B0D12]">
                            <div class="font-bold text-sm text-white mb-1">${info.title}</div>
                            <div class="text-xs text-gray-500">Borrower: ${req[0].slice(0,6)}...</div>
                            <div class="text-xs mt-1 font-mono text-emerald-400">Rate: ${Number(loan[2])}%</div>
                            ${action}
                        </div>`;
                    } 
                    
                    // REFINANCING OPPORTUNITY (For other Lenders)
                    else if (ext[0] && !req[0].toLowerCase().includes(userAddress.toLowerCase())) {
                        feed += `
                        <div class="p-3 border border-yellow-900/30 rounded bg-[#1A1500] flex justify-between items-center">
                            <div>
                                <div class="font-bold text-sm text-yellow-500">⚡ Refinance Opportunity</div>
                                <div class="text-xs text-gray-400">${info.title}</div>
                                <div class="text-xs text-gray-500">Current Rate: ${Number(loan[2])}%</div>
                            </div>
                            <button onclick="buyout(${i})" class="bg-yellow-600 hover:bg-yellow-500 text-white text-xs px-3 py-2 rounded font-bold">Buyout Loan</button>
                        </div>`;
                    }
                } 
                
                // PENDING REQUEST (My Own - Show in Borrow Tab)
                else if (req[5] && !req[6] && req[0].toLowerCase() === myProxyLower) {
                     bLoans += `
                        <div class="p-4 border border-dashed border-gray-700 rounded-xl bg-[#0B0D12] opacity-75">
                            <div class="flex justify-between mb-2">
                                <span class="font-bold text-white text-sm truncate">${info.title}</span>
                                <span class="text-xs bg-orange-500/20 text-orange-400 px-2 rounded">Pending</span>
                            </div>
                            <div class="text-xs text-gray-500 mb-3">Waiting for lender...</div>
                            <button onclick="cancelRequest(${i})" class="w-full border border-red-900 text-red-400 hover:bg-red-900/20 py-2 rounded text-xs">Cancel Request</button>
                        </div>`;
                }

            } catch(e) {}
        }
        
        // OFFERS
        for(let i=1; i<Number(nextOff); i++) {
            try {
                const off = await marketContract.offers(i);
                if(off[3]) {
                    const req = await marketContract.requests(off[0]);
                    if(req[0].toLowerCase() === myProxyLower) {
                        const info = await (await fetch(`${RENDER_API_URL}/market-info?tokenId=${req[1]}`)).json();
                        bOffers += `
                        <div class="p-4 border border-green-900/30 rounded-xl bg-[#051105] flex justify-between items-center">
                            <div>
                                <div class="text-[10px] text-green-400 uppercase tracking-wider mb-1">Offer Received</div>
                                <div class="font-bold text-sm text-white">${info.title}</div>
                                <div class="text-xs text-emerald-400 font-mono mt-1">Rate: ${Number(off[2])}% Interest</div>
                            </div>
                            <button onclick="acceptOffer(${i})" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded text-xs font-bold text-white shadow-lg shadow-green-900/20">Accept</button>
                        </div>`;
                    }
                }
            } catch(e) {}
        }

        if(bOffers === "") bOffers = `<div class="text-center text-gray-600 py-4 text-xs italic">No offers yet.</div>`;
        if(bLoans === "") bLoans = `<div class="text-center text-gray-600 py-4 text-xs italic">No active debts.</div>`;
        if(lLoans === "") lLoans = `<div class="text-center text-gray-600 py-4 text-xs italic">No investments.</div>`;

        document.getElementById("marketFeed").innerHTML = feed;
        document.getElementById("borrowerOffers").innerHTML = bOffers;
        document.getElementById("borrowerLoans").innerHTML = bLoans;
        document.getElementById("lenderLoans").innerHTML = lLoans;
        
        document.getElementById("statBorrowed").innerText = `$${borrowed.toFixed(2)}`;
        document.getElementById("statLent").innerText = `$${lent.toFixed(2)}`;
        document.getElementById("statCount").innerText = count;
    }

    // ACTIONS
    async function makeOffer(id) {
        const rate = document.getElementById("rate_"+id).value;
        if(!rate) return alert("Enter rate");
        const usdc = new ethers.Contract(USDC_ADDR, ["function approve(address,uint256)"], signer);
        await (await usdc.approve(MARKET_ADDR, ethers.MaxUint256)).wait();
        await (await marketContract.makeOffer(id, rate)).wait();
        loadData();
    }

    async function reqExt(id) { const d = prompt("New Duration (Mins):"); if(d) await signAndRelay("requestExtension", [id, BigInt(d*60)]); }
    async function acceptExt(id) { const usdc = new ethers.Contract(USDC_ADDR, ["function approve(address,uint256)"], signer); await (await usdc.approve(MARKET_ADDR, ethers.MaxUint256)).wait(); await (await marketContract.acceptExtension(id)).wait(); }
    async function buyout(id) { const usdc = new ethers.Contract(USDC_ADDR, ["function approve(address,uint256)"], signer); await (await usdc.approve(MARKET_ADDR, ethers.MaxUint256)).wait(); await (await marketContract.buyoutLoan(id)).wait(); }
    async function liquidate(id) { if(confirm("Seize collateral?")) await (await marketContract.liquidateByTime(id)).wait(); }
    
    async function acceptOffer(id) { if(confirm("Accept loan offer?")) await signAndRelay("acceptOffer", [id]); }
    async function repay(id) { if(confirm("Repay loan + interest?")) await signAndRelay("repayLoan", [id]); }
    async function cancelRequest(id) { if(confirm("Cancel request and unlock shares?")) await signAndRelay("cancelRequest", [id]); }
    </script>
</body>
</html>
