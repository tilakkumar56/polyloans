<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyLoans | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"'],mono:['"JetBrains Mono"']},colors:{bg:'#020408',surface:'#0B0D12',border:'#1E2129',brand:'#6366F1'}}}}; </script>
    <style>body{background:#020408;color:#E2E8F0}.panel{background:#0B0D12;border:1px solid #1E2129}.input-prem{background:#050608;border:1px solid #1E2129;color:#FFF}.hidden-tab{display:none}</style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="h-16 border-b border-[#1E2129] flex items-center justify-between px-6 bg-[#020408]">
        <div class="flex items-center gap-8"><span class="font-bold text-lg text-white">PolyLoans</span><div id="navTabs" class="hidden flex gap-4 text-sm font-medium"><button onclick="switchTab('overview')">Overview</button><button onclick="switchTab('borrow')">Borrow</button><button onclick="switchTab('lend')">Lend</button></div></div>
        <button id="btnConnect" onclick="connectWallet()" class="bg-[#6366F1] px-4 py-2 rounded text-sm font-bold text-white">Connect Wallet</button>
        <div id="userAddr" class="hidden font-mono text-xs text-gray-400"></div>
    </nav>
    <main class="p-6 max-w-7xl mx-auto w-full">
        
        <div id="view-overview" class="space-y-6">
            <h2 class="text-xl font-bold">Dashboard</h2>
            <div class="grid grid-cols-3 gap-6">
                <div class="panel p-6 rounded-xl"><div>Borrowed</div><div class="text-2xl font-bold text-red-400" id="statBorrowed">$0.00</div></div>
                <div class="panel p-6 rounded-xl"><div>Lent</div><div class="text-2xl font-bold text-emerald-400" id="statLent">$0.00</div></div>
                <div class="panel p-6 rounded-xl"><div>Shares</div><div class="text-2xl font-bold text-[#6366F1]" id="statShares">0</div></div>
            </div>
        </div>

        <div id="view-borrow" class="hidden-tab grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-4 panel rounded-xl p-6 space-y-4">
                <h2 class="font-bold">New Request</h2>
                <select id="positionSelect" onchange="autoFillForm()" class="input-prem w-full rounded p-2 text-sm"></select>
                <div id="priceDisplay" class="text-xs h-4"></div>
                <input type="text" id="b_tokenId" class="hidden">
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="b_shares" placeholder="Shares" class="input-prem w-full rounded p-2 text-sm" oninput="checkLTV()">
                    <input type="number" id="b_principal" placeholder="USDC" class="input-prem w-full rounded p-2 text-sm" oninput="checkLTV()">
                </div>
                <div id="ltvWarning" class="text-xs text-right h-4"></div>
                <input type="number" id="b_duration" class="input-prem w-full rounded p-2 text-sm" placeholder="Duration (Minutes)">
                <button onclick="handleCreateRequest()" class="w-full bg-[#6366F1] py-3 rounded font-bold text-sm">Sign & Post</button>
            </div>
            <div class="lg:col-span-8 space-y-6">
                <div class="panel rounded-xl p-6"><h2 class="font-bold mb-4">Incoming Offers</h2><div id="borrowerOffers" class="space-y-2"></div></div>
                <div class="panel rounded-xl p-6"><h2 class="font-bold mb-4">Active Debts</h2><div id="borrowerLoans" class="space-y-2"></div></div>
            </div>
        </div>

        <div id="view-lend" class="hidden-tab space-y-6">
            <div class="panel rounded-xl overflow-hidden p-4"><h2 class="font-bold mb-4">Market Feed</h2><div id="marketFeed" class="space-y-2"></div></div>
            <div class="panel rounded-xl p-6"><h2 class="font-bold mb-4">Active Investments</h2><div id="lenderLoans" class="space-y-2"></div></div>
        </div>
    </main>

    <script>
    const MARKET_ADDR = "0x30672b8B427BD7277c8467221441e2D3Dbf833E4"; 
    const USDC_ADDR = "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359";
    const RENDER_API_URL = "https://polyloans-api.onrender.com"; 
    let signer, userAddress, marketContract, myProxy;

    const MARKET_ABI = [
        "function createRequest(uint256,uint256,uint256,uint256) external returns (uint256)",
        "function makeOffer(uint256,uint256,uint256) external returns (uint256)",
        "function acceptOffer(uint256) external",
        "function repayLoan(uint256) external",
        "function requestExtension(uint256,uint256) external",
        "function acceptExtension(uint256) external",
        "function buyoutLoan(uint256) external",
        "function liquidateByTime(uint256) external",
        "function requests(uint256) view returns (address, uint256, uint256, uint256, uint256, bool, bool)",
        "function loans(uint256) view returns (address, uint256, uint256, uint256)",
        "function offers(uint256) view returns (uint256, address, uint256, bool)",
        "function extensions(uint256) view returns (bool, uint256, uint256)",
        "function nextRequestId() view returns (uint256)",
        "function nextOfferId() view returns (uint256)"
    ];
    const USDC_ABI = ["function approve(address, uint256) external"];

    async function connectWallet() {
        const provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        userAddress = await signer.getAddress();
        marketContract = new ethers.Contract(MARKET_ADDR, MARKET_ABI, signer);
        document.getElementById("userAddr").innerText = userAddress;
        document.getElementById("btnConnect").style.display = "none";
        document.getElementById("navTabs").classList.remove("hidden");
        switchTab('overview');
        
        try { const r = await fetch(`${RENDER_API_URL}/get-nonce?user=${userAddress}`); const d = await r.json(); window.myProxy = d.proxy; } catch(e){}
        scanPortfolio(); loadData(); setInterval(loadData, 2000);
    }

    function switchTab(t) {
        ['overview','borrow','lend'].forEach(v => document.getElementById(`view-${v}`).classList.add('hidden-tab'));
        document.getElementById(`view-${t}`).classList.remove('hidden-tab');
    }

    async function scanPortfolio() {
        const res = await fetch(`${RENDER_API_URL}/portfolio?user=${userAddress}`);
        const data = await res.json();
        const sel = document.getElementById("positionSelect");
        sel.innerHTML = '<option>Select Asset</option>';
        data.forEach(p => {
            const opt = document.createElement("option");
            opt.value = p.asset; opt.text = `${p.title} (${p.size})`;
            opt.setAttribute("data-bal", p.size); opt.setAttribute("data-price", p.livePrice);
            sel.appendChild(opt);
        });
        document.getElementById("statShares").innerText = data.length;
    }

    function autoFillForm() {
        const opt = document.getElementById("positionSelect").selectedOptions[0];
        if(opt.value) {
            document.getElementById("b_tokenId").value = opt.value;
            document.getElementById("balanceDisplay").innerText = `Bal: ${opt.getAttribute("data-bal")} | $${Number(opt.getAttribute("data-price")).toFixed(2)}`;
        }
    }

    function checkLTV() {
        const shares = document.getElementById("b_shares").value;
        const principal = document.getElementById("b_principal").value;
        const opt = document.getElementById("positionSelect").selectedOptions[0];
        const price = opt ? Number(opt.getAttribute("data-price")) : 0.5;
        const limit = shares * price * 0.5;
        document.getElementById("ltvWarning").innerText = principal > limit ? `Max: $${limit.toFixed(2)}` : "LTV OK";
    }

    async function signAndRelay(func, args) {
        const metaRes = await fetch(`${RENDER_API_URL}/get-nonce?user=${userAddress}`);
        const meta = await metaRes.json();
        const iface = new ethers.Interface(MARKET_ABI);
        const data = iface.encodeFunctionData(func, args);
        const domain = { verifyingContract: meta.proxy, chainId: 137 };
        const types = { SafeTx: [{type:"address",name:"to"},{type:"uint256",name:"value"},{type:"bytes",name:"data"},{type:"uint8",name:"operation"},{type:"uint256",name:"safeTxGas"},{type:"uint256",name:"baseGas"},{type:"uint256",name:"gasPrice"},{type:"address",name:"gasToken"},{type:"address",name:"refundReceiver"},{type:"uint256",name:"nonce"}] };
        const message = { to: MARKET_ADDR, value: 0, data, operation: 0, safeTxGas: 0, baseGas: 0, gasPrice: 0, gasToken: "0x0000000000000000000000000000000000000000", refundReceiver: "0x0000000000000000000000000000000000000000", nonce: meta.nonce };
        const sig = await signer.signTypedData(domain, types, message);
        await fetch(`${RENDER_API_URL}/relay-tx`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ proxy: meta.proxy, to: MARKET_ADDR, data, signature: sig }) });
        alert("Success!");
    }

    async function handleCreateRequest() {
        const id = document.getElementById("b_tokenId").value;
        const s = document.getElementById("b_shares").value;
        const p = document.getElementById("b_principal").value;
        const d = document.getElementById("b_duration").value;
        await signAndRelay('createRequest', [id, BigInt(s*1e6), BigInt(p*1e6), BigInt(d*60)]);
    }

    async function loadData() {
        const nextId = await marketContract.nextRequestId();
        const nextOff = await marketContract.nextOfferId();
        let feed="", bOffers="", bLoans="", lLoans="", borrowed=0, lent=0;

        for(let i=1; i<Number(nextId); i++) {
            try {
                const req = await marketContract.requests(i);
                const loan = await marketContract.loans(i);
                const info = await (await fetch(`${RENDER_API_URL}/market-info?tokenId=${req[1]}`)).json();
                
                if(req[5] && !req[6]) { 
                    if(req[0].toLowerCase() !== window.myProxy?.toLowerCase()) {
                        feed += `<div class="p-3 border border-gray-800 rounded bg-[#050608] flex justify-between">
                            <div><div class="font-bold text-sm">${info.title}</div><div class="text-xs text-gray-500">${ethers.formatUnits(req[2],6)} Shares | Ask: $${ethers.formatUnits(req[3],6)}</div><a href="https://polymarket.com/event/${info.slug}" target="_blank" class="text-blue-500 text-xs">View Market ↗</a><div class="text-xs text-gray-600 font-mono">${req[0].slice(0,6)}...</div></div>
                            <div><input id="rate_${i}" placeholder="%" class="w-12 bg-black border text-xs p-1"><button onclick="makeOffer(${i})" class="bg-blue-600 px-2 py-1 text-xs rounded text-white ml-1">Offer</button></div></div>`;
                    }
                }

                if(req[6]) {
                    const ext = await marketContract.extensions(i);
                    const end = Number(loan[1]) + Number(loan[3]);
                    const timeLeft = end - Math.floor(Date.now()/1000);
                    
                    if(req[0].toLowerCase() === window.myProxy?.toLowerCase()) {
                        borrowed += Number(ethers.formatUnits(req[3],6));
                        let extStatus = ext[0] ? `<span class="text-yellow-500 text-xs">Ext Req Sent</span>` : `<button onclick="reqExt(${i})" class="text-xs text-blue-500 underline">Extend</button>`;
                        bLoans += `<div class="p-3 border border-gray-800 rounded bg-[#050608]"><div class="font-bold text-sm">${info.title}</div><div class="text-xs text-gray-500">Lender: ${loan[0].slice(0,6)}...</div><div class="text-xs mt-1">${timeLeft>0 ? (timeLeft/60).toFixed(0)+"m left" : "EXPIRED"}</div><div class="flex gap-2 mt-2"><button onclick="repay(${i})" class="bg-green-600 px-3 py-1 rounded text-xs text-white">Repay</button>${extStatus}</div></div>`;
                    }
                    
                    if(loan[0].toLowerCase() === userAddress.toLowerCase()) {
                        lent += Number(ethers.formatUnits(req[3],6));
                        let action = timeLeft<=0 ? `<button onclick="liquidate(${i})" class="bg-red-600 text-white text-xs px-2 py-1 rounded">Seize</button>` : "";
                        if(ext[0]) action += `<button onclick="acceptExt(${i})" class="bg-blue-600 text-white text-xs px-2 py-1 rounded ml-1">Accept Ext</button>`;
                        
                        lLoans += `<div class="p-3 border border-gray-800 rounded bg-[#050608]"><div class="font-bold text-sm">${info.title}</div><div class="text-xs text-gray-500">Borrower: ${req[0].slice(0,6)}...</div><div class="text-xs mt-1">${timeLeft>0 ? (timeLeft/60).toFixed(0)+"m left" : "EXPIRED"}</div><div class="mt-2">${action}</div></div>`;
                    } else if (ext[0] && !req[0].toLowerCase().includes(userAddress.toLowerCase())) {
                        feed += `<div class="p-3 border border-yellow-900/30 rounded bg-[#050608]"><div class="font-bold text-sm text-yellow-500">Refinance Opp: ${info.title}</div><div class="text-xs text-gray-500">Current Rate: ${Number(loan[2])}%</div><button onclick="buyout(${i})" class="bg-yellow-600 text-white text-xs px-2 py-1 rounded mt-1">Buyout Loan</button></div>`;
                    }
                }
            } catch(e) {}
        }
        
        for(let i=1; i<Number(nextOff); i++) {
            try {
                const off = await marketContract.offers(i);
                if(off[3]) {
                    const req = await marketContract.requests(off[0]);
                    if(req[0].toLowerCase() === window.myProxy?.toLowerCase()) {
                        bOffers += `<div class="p-3 border border-gray-800 rounded bg-[#050608] flex justify-between"><div><div class="font-bold text-sm">Offer #${i}</div><div class="text-xs text-green-400">${Number(off[2])}% Interest</div></div><button onclick="acceptOffer(${i})" class="bg-green-600 px-3 py-1 rounded text-xs text-white">Accept</button></div>`;
                    }
                }
            } catch(e) {}
        }

        document.getElementById("marketFeed").innerHTML = feed;
        document.getElementById("borrowerLoans").innerHTML = bLoans;
        document.getElementById("lenderLoans").innerHTML = lLoans;
        document.getElementById("borrowerOffers").innerHTML = bOffers;
        document.getElementById("statBorrowed").innerText = `$${borrowed}`;
        document.getElementById("statLent").innerText = `$${lent}`;
    }

    async function makeOffer(id) {
        const rate = document.getElementById("rate_"+id).value;
        const usdc = new ethers.Contract(USDC_ADDR, ["function approve(address,uint256)"], signer);
        await (await usdc.approve(MARKET_ADDR, ethers.MaxUint256)).wait();
        await (await marketContract.makeOffer(id, rate)).wait();
    }

    async function reqExt(id) { const d = prompt("New Duration (Mins):"); await signAndRelay("requestExtension", [id, BigInt(d*60)]); }
    async function acceptExt(id) { const usdc = new ethers.Contract(USDC_ADDR, ["function approve(address,uint256)"], signer); await (await usdc.approve(MARKET_ADDR, ethers.MaxUint256)).wait(); await (await marketContract.acceptExtension(id)).wait(); }
    async function buyout(id) { const usdc = new ethers.Contract(USDC_ADDR, ["function approve(address,uint256)"], signer); await (await usdc.approve(MARKET_ADDR, ethers.MaxUint256)).wait(); await (await marketContract.buyoutLoan(id)).wait(); }
    async function liquidate(id) { await (await marketContract.liquidateByTime(id)).wait(); }
    
    async function acceptOffer(id) { await signAndRelay("acceptOffer", [id]); }
    async function repay(id) { await signAndRelay("repayLoan", [id]); }
    </script>
</body>
</html>
